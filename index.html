<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Battle Pass Tracker</title>

  <style>
    :root {
      --bg-color: #121417;
      --panel-bg: #1e2228;
      --card-bg: #282c34;
      --border-color: #3b404a;
      --accent-color: #e5b35c;
      --highlight-color: #ff9800;
      --text-color: #e0e0e0;
      --text-dim: #9e9e9e;
      --claimed-bg: rgba(76, 175, 80, 0.25);
      --claimed-border: #4caf50;
      --timer-color: #7ddcff;
      --timer-glow: rgba(93, 211, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      height: 60px;
      flex-shrink: 0;
    }

    header img { height: 35px; object-fit: contain; }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* ===== SEASON NAME GLOW ===== */
    .season-name {
      color: #ffffff;
      font-weight: 700;
      opacity: 1;
      filter: none;

      text-shadow:
        0 0 2px #ffffff,
        0 0 4px #ffffff,
        0 0 7px rgba(255, 255, 255, 0.95),
        0 0 12px rgba(255, 255, 255, 0.8),
        0 0 18px rgba(255, 255, 255, 0.55);

      animation: seasonGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes seasonGlow {
      from {
        color: #ffffff;
        text-shadow:
          0 0 2px #ffffff,
          0 0 4px #ffffff,
          0 0 7px rgba(255, 255, 255, 0.95),
          0 0 12px rgba(255, 255, 255, 0.8),
          0 0 18px rgba(255, 255, 255, 0.55);
      }

      to {
        color: #ffffff;
        text-shadow:
          0 0 2px #ffffff,
          0 0 5px #ffffff,
          0 0 8px #ffffff,
          0 0 14px rgba(255, 255, 255, 0.95),
          0 0 22px rgba(255, 255, 255, 0.7);
      }
    }

    #seasonName {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      margin-left: 6px;
      letter-spacing: 0;
    }

    /* ===== HEADER RIGHT (RESET BUTTON + PROGRESS + COUNTDOWN) ===== */
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .reset-progress-btn {
      background-color: transparent;
      color: #ff8a80;
      border: 1px solid rgba(255, 82, 82, 0.6);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .reset-progress-btn:hover {
      background-color: rgba(255, 82, 82, 0.15);
      border-color: #ff5252;
      color: #fff;
    }

    /* ===== PROGRESS ===== */
    .progress-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .progress-title {
      font-size: 0.58rem;
      color: rgba(120, 255, 150, 0.7);
      letter-spacing: 1.5px;
      margin-bottom: 1px;
      text-transform: uppercase;
    }

    #progressCount {
      color: #7dff9f;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 2px #fff, 0 0 5px rgba(93,255,138,.85), 0 0 9px rgba(93,255,138,.85), 0 0 15px rgba(93,255,138,.7), 0 0 24px rgba(93,255,138,.4);
      animation: progressTextGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes progressTextGlow {
      from { text-shadow: 0 0 2px #fff, 0 0 5px rgba(93,255,138,.85), 0 0 9px rgba(93,255,138,.85), 0 0 15px rgba(93,255,138,.7), 0 0 24px rgba(93,255,138,.4); }
      to   { text-shadow: 0 0 2px #fff, 0 0 6px #fff, 0 0 10px rgba(93,255,138,.9), 0 0 18px rgba(93,255,138,.9), 0 0 28px rgba(93,255,138,.55); }
    }

    /* ===== SEASON COUNTDOWN ===== */
    .season-countdown {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      user-select: none;
    }

    .season-countdown-title {
      font-size: 0.58rem;
      color: rgba(125, 220, 255, 0.7);
      letter-spacing: 1.5px;
      margin-bottom: 1px;
      text-transform: uppercase;
    }

    #seasonCountdown {
      color: var(--timer-color);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 2px #fff, 0 0 5px var(--timer-glow), 0 0 9px var(--timer-glow), 0 0 15px rgba(93,211,255,.7), 0 0 24px rgba(93,211,255,.4);
      animation: countdownGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes countdownGlow {
      from { text-shadow: 0 0 2px #fff, 0 0 5px var(--timer-glow), 0 0 9px var(--timer-glow), 0 0 15px rgba(93,211,255,.7), 0 0 24px rgba(93,211,255,.4); }
      to   { text-shadow: 0 0 2px #fff, 0 0 6px #fff, 0 0 10px var(--timer-glow), 0 0 18px var(--timer-glow), 0 0 28px rgba(93,211,255,.55); }
    }

    /* ===== LAYOUT ===== */
    .main-container { display: flex; flex: 1; overflow: hidden; }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .map-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 5px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }

    .map-card:hover { border-color: var(--border-color); background-color: #323741; }

    .map-card.active,
    .map-card.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
      background-color: #3a3226;
    }

    .map-name { font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; }

    .map-docs {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .doc-badge { background-color: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; }

    /* ===== ROADMAP ===== */
    .roadmap-scroll {
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 15px;
      display: flex;
      gap: 15px;
      background-color: #16181d;
      scrollbar-color: #555d6d #1b1e23;
      scrollbar-width: auto;
    }

    .roadmap-scroll::-webkit-scrollbar { height: 10px; }
    .roadmap-scroll::-webkit-scrollbar-track { background: #1b1e23; border-radius: 5px; }
    .roadmap-scroll::-webkit-scrollbar-thumb { background: #555d6d; border-radius: 5px; }
    .roadmap-scroll::-webkit-scrollbar-thumb:hover { background: #70798a; }

    .roadmap-column {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .roadmap-column.page-toggleable { cursor: pointer; }
    .roadmap-column.page-toggleable:hover { border-color: #596271; }

    .roadmap-column.page-claimed {
      border-color: rgba(76, 175, 80, 0.75);
      box-shadow: 0 0 8px rgba(76,175,80,0.18), inset 0 0 12px rgba(76,175,80,0.06);
    }

    .column-header {
      background-color: var(--card-bg);
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: var(--accent-color);
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .column-header:hover { background-color: #323741; }

    .page-title-area { display: flex; align-items: center; gap: 7px; }

    .page-claim-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555d6d;
      transition: all 0.2s ease;
    }

    .roadmap-column.page-claimed .page-claim-indicator {
      background: #4caf50;
      box-shadow: 0 0 5px rgba(76,175,80,0.8), 0 0 10px rgba(76,175,80,0.45);
    }

    .page-req { font-size: 0.75rem; color: var(--text-dim); }

    .page-status-text { font-size: 0.62rem; color: var(--text-dim); font-weight: 500; }
    .roadmap-column.page-claimed .page-status-text { color: #6fd676; }

    .column-body {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      overflow-y: hidden;
      flex: 1;
      align-content: start;
    }

    /* ===== REWARD CARD ===== */
    .reward-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .reward-card:hover { border-color: #555d6d; }

    .reward-card.claimed {
      background-color: var(--claimed-bg);
      border-color: var(--claimed-border);
      box-shadow: inset 0 0 10px rgba(76,175,80,0.3), 0 0 4px rgba(76,175,80,0.15);
    }

    .reward-title-row { display: flex; justify-content: space-between; align-items: center; }

    .reward-title {
      font-weight: 600;
      font-size: 0.8rem;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100px;
    }

    .edit-btn { cursor: pointer; color: #ff5252; font-size: 0.85rem; transition: transform 0.1s; }
    .edit-btn:hover { transform: scale(1.2); }

    .reward-img-container {
      width: 100%;
      height: 70px;
      background-color: rgba(0,0,0,0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reward-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .reward-costs { display: flex; flex-wrap: wrap; gap: 3px; }

    .cost-tag {
      font-size: 0.7rem;
      background-color: #121417;
      border: 1px solid var(--border-color);
      padding: 1px 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .cost-tag img { width: 12px; height: 12px; }

    /* ===== BOTTOM PANEL ===== */
    .bottom-panel {
      height: 220px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      min-height: 0;
    }

    .panel-title { font-size: 0.9rem; font-weight: bold; color: var(--accent-color); }

    .docs-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;
      flex: 1;
      min-height: 0;
      align-items: center;
    }

    .doc-item {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      height: 156px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .doc-item.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
      background-color: #3a3226;
    }

    .doc-icon-title {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .doc-icon-title img { width: 70px; height: 70px; object-fit: contain; flex-shrink: 0; }

    .doc-name {
      font-size: 0.85rem;
      color: var(--text-color);
      text-align: left;
      font-weight: 500;
      word-break: keep-all;
    }

    .doc-counters {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 4px;
    }

    .doc-counter-group { display: flex; align-items: center; gap: 4px; }

    .counter-label { font-size: 0.8rem; color: var(--text-dim); font-weight: bold; }

    .doc-input {
      width: 48px;
      height: 26px;
      background-color: #121417;
      border: 1px solid var(--border-color);
      color: #fff;
      text-align: center;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .doc-req {
      font-size: 0.8rem;
      color: #ff5252;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    @media (max-width: 1100px) {
      .docs-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .bottom-panel { height: 250px; }
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background-color: var(--panel-bg);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 20px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal h3 { color: var(--accent-color); font-size: 1.1rem; text-align: center; }

    .modal-price-info { font-size: 0.8rem; color: var(--text-dim); text-align: center; }

    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .modal-input-group label { font-size: 0.75rem; display: flex; align-items: center; gap: 5px; }
    .modal-input-group label img { width: 14px; height: 14px; }

    .modal-input-group input {
      width: 45px;
      background-color: #121417;
      border: 1px solid var(--border-color);
      color: #fff;
      text-align: center;
      padding: 2px;
      border-radius: 3px;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-save   { background-color: #4caf50; color: #fff; }
    .btn-cancel { background-color: #f44336; color: #fff; }
    .btn-reset  { background-color: #555;    color: #fff; }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <a href="https://www.escapefromtarkov.com/" target="_blank">
      <img src="https://www.escapefromtarkov.com/build-eft-site/_nuxt/logo.WO0wViWU.webp" alt="Escape from Tarkov">
    </a>

    <h1>
      Tarkov Battle Pass Tracker
      <span id="seasonName" class="season-name"></span>
    </h1>

    <div class="header-right">
      <button class="reset-progress-btn" id="resetProgressBtn" title="클레임 상태와 문서 보유량을 초기화합니다">초기화</button>

      <div class="progress-box">
        <div class="progress-title">PROGRESS</div>
        <div id="progressCount">0 / 0</div>
      </div>

      <div class="season-countdown">
        <div class="season-countdown-title">SEASON TIME REMAINING</div>
        <div id="seasonCountdown">00 : 00 : 00 : 00</div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main-container">

    <div class="sidebar" id="mapList">
      <h2>맵 목록</h2>
    </div>

    <div class="content-area">
      <div class="roadmap-scroll" id="roadmapContainer"></div>

      <div class="bottom-panel">
        <div class="panel-title">문서 보유량 및 필요 수량</div>
        <div class="docs-grid" id="docsGrid"></div>
      </div>
    </div>

  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle">Edit Costs</h3>

      <div class="modal-price-info">
        해당 보상의 최대 재화 합계: <span id="maxPriceVal">0</span>
      </div>

      <div class="modal-grid" id="modalGrid"></div>

      <div class="modal-actions">
        <button class="btn btn-reset" id="modalResetBtn">기본값</button>
        <button class="btn btn-cancel" id="modalCancelBtn">취소</button>
        <button class="btn btn-save" id="modalSaveBtn">저장</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       CONFIG
    ========================================================= */

    // 마우스 휠 1칸당 가로 이동 배율 (값이 클수록 더 멀리 이동)
    const WHEEL_SPEED = 4;

    // 휠 스크롤 감속 계수 (0~1, 클수록 빠르게 목표 위치에 도달)
    const WHEEL_EASING = 0.18;

    /* =========================================================
       DATA
    ========================================================= */

    // 표시 순서: 회계 - PMC - 프로젝트 - 설계도 - 테스트 - 사용자 - 의료 - 장비
    const DOCS_DATA = {
      FD:   { name: "회계 문서",     file: "FD.webp" },
      PMC:  { name: "PMC 인사 문서", file: "PMC.webp" },
      PD:   { name: "프로젝트 문서", file: "PD.webp" },
      BP:   { name: "설계도",        file: "BP.webp" },
      TD:   { name: "테스트 문서",   file: "TD.webp" },
      UD:   { name: "사용자 문서",   file: "UD.webp" },
      MD:   { name: "의료 문서",     file: "MD.webp" },
      Tech: { name: "장비 문서",     file: "Tech.webp" }
    };

    const MAPS_DATA = [
      { name: "세관",          docs: ["FD", "PD"] },
      { name: "타르코프 시내", docs: ["FD", "UD"] },
      { name: "인터체인지",    docs: ["FD", "BP"] },
      { name: "리저브",        docs: ["PMC", "PD"] },
      { name: "등대",          docs: ["PMC", "Tech"] },
      { name: "쇄빙선",        docs: ["PMC", "TD"] },
      { name: "공장",          docs: ["PD", "BP"] },
      { name: "미궁",          docs: ["BP", "MD"] },
      { name: "해안선",        docs: ["TD", "Tech"] },
      { name: "삼림",          docs: ["TD", "Tech"] },
      { name: "그라운드 제로", docs: ["UD", "MD"] },
      { name: "실험실",        docs: ["UD", "MD"] }
    ];

    // Fandom 파싱 실패 시 사용할 기본 데이터
    let roadmapPages = [
      {
        page: 1,
        req: "4/5",
        rewards: [
          { id: "p1_1", name: "Dogtag",  price: 5, defaultCosts: { FD: 1 },         icon: "" },
          { id: "p1_2", name: "TarCoin", price: 3, defaultCosts: { PD: 2, BP: 1 }, icon: "" },
          { id: "p1_3", name: "Poster",  price: 3, defaultCosts: { TD: 2, UD: 1 }, icon: "" },
          { id: "p1_4", name: "Crate",   price: 3, defaultCosts: { BP: 2, FD: 1 }, icon: "" }
        ]
      }
    ];

    /* =========================================================
       STATE / LOCAL STORAGE
    ========================================================= */

    const loadStore = key => JSON.parse(localStorage.getItem(key) || "{}");
    const saveStore = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    let userCosts = loadStore("eft_user_costs");
    let userInventory = loadStore("eft_user_inventory");
    let claimedRewards = loadStore("eft_claimed_rewards");

    let selectedMap = null;
    let selectedDoc = null;
    let currentEditReward = null;

    // 시즌 종료 시각 (UTC timestamp, ms)
    let seasonEndTimestamp = null;
    let countdownInterval = null;

    // 위키에서 파싱한 현재 시즌 식별값 (파싱 실패 시 빈 문자열)
    let currentSeasonKey = "";

    const SEASON_KEY_STORAGE = "eft_season_key";

    const $ = id => document.getElementById(id);
    const cleanText = el => (el?.innerText || el?.textContent || "").replace(/\s+/g, " ").trim();
    const getCosts = reward => userCosts[reward.id] || reward.defaultCosts;

    /* =========================================================
       RESET (SEASON CHANGE / MANUAL)
    ========================================================= */

    /*
     * 수동 초기화: 클레임 상태와 문서 보유량만 초기화한다.
     * Edit Costs로 수정한 재화(userCosts)는 그대로 유지한다.
     */
    function resetClaimsAndInventory() {
      claimedRewards = {};
      userInventory = {};

      saveStore("eft_claimed_rewards", claimedRewards);
      saveStore("eft_user_inventory", userInventory);
    }

    /*
     * 시즌 변경 시 초기화: 클레임, 보유량, 수정한 재화까지 모두 기본값으로 되돌린다.
     */
    function resetAllProgress() {
      resetClaimsAndInventory();

      userCosts = {};
      saveStore("eft_user_costs", userCosts);
    }

    /*
     * 저장된 시즌 식별값과 현재 파싱한 시즌이 다르면 전체 초기화한다.
     * - 시즌을 파싱하지 못한 경우(currentSeasonKey 없음)에는 아무것도 하지 않는다.
     * - 저장된 식별값이 없는 최초 실행에서는 기존 데이터를 유지하고 식별값만 저장한다.
     * 초기화가 일어났으면 true를 반환한다.
     */
    function checkSeasonChange() {
      if (!currentSeasonKey) return false;

      const savedKey = localStorage.getItem(SEASON_KEY_STORAGE);
      localStorage.setItem(SEASON_KEY_STORAGE, currentSeasonKey);

      if (!savedKey || savedKey === currentSeasonKey) return false;

      resetAllProgress();
      console.info(`시즌 변경 감지: "${savedKey}" → "${currentSeasonKey}", 전체 진행도를 초기화했습니다.`);
      return true;
    }

    function handleResetButtonClick() {
      const ok = confirm("클레임된 보상과 문서 보유량을 초기화할까요?\n(Edit Costs로 수정한 재화는 유지됩니다)");
      if (!ok) return;

      resetClaimsAndInventory();

      // 초기화 후에는 첫 페이지 기준으로 다시 그린다.
      const container = $("roadmapContainer");
      if (container) container.scrollLeft = 0;

      renderDocsGrid();
      updateHighlights();
      renderRoadmap();
      calculateRequirements();
    }

    $("resetProgressBtn").addEventListener("click", handleResetButtonClick);

    /* =========================================================
       INIT
    ========================================================= */

    async function init() {
      renderMapList();
      renderDocsGrid();

      await fetchFandomBattlePass();

      // 시즌이 바뀌었다면 전체 초기화 후 보유량 UI를 다시 그린다.
      if (checkSeasonChange()) {
        renderDocsGrid();
        updateHighlights();
      }

      renderRoadmap();
      calculateRequirements();
      setupHorizontalWheel();
      startSeasonCountdown();
    }

    /* =========================================================
       MAP LIST
    ========================================================= */

    function renderMapList() {
      const mapListEl = $("mapList");
      mapListEl.innerHTML = "<h2>맵 목록</h2>";

      MAPS_DATA.forEach(map => {
        const card = document.createElement("div");
        card.className = `map-card ${selectedMap === map.name ? "active" : ""}`;
        card.id = `map-${map.name}`;

        const docBadges = map.docs
          .map(code => `<span class="doc-badge">${DOCS_DATA[code].name}</span>`)
          .join("");

        card.innerHTML = `
          <div class="map-name">${map.name}</div>
          <div class="map-docs">${docBadges}</div>
        `;

        card.addEventListener("click", () => handleMapClick(map));
        mapListEl.appendChild(card);
      });
    }

    function handleMapClick(map) {
      selectedMap = selectedMap === map.name ? null : map.name;
      selectedDoc = null;
      updateHighlights();
    }

    function handleDocClick(docCode) {
      selectedDoc = selectedDoc === docCode ? null : docCode;
      selectedMap = null;
      updateHighlights();
    }

    function updateHighlights() {
      MAPS_DATA.forEach(map => {
        const el = $(`map-${map.name}`);
        if (!el) return;

        el.classList.remove("active", "highlight");

        if (selectedMap === map.name) {
          el.classList.add("active");
        } else if (selectedDoc && map.docs.includes(selectedDoc)) {
          el.classList.add("highlight");
        }
      });

      const mapObj = MAPS_DATA.find(m => m.name === selectedMap);

      Object.keys(DOCS_DATA).forEach(code => {
        const el = $(`doc-item-${code}`);
        if (!el) return;

        el.classList.remove("highlight");

        if (selectedDoc === code || (mapObj && mapObj.docs.includes(code))) {
          el.classList.add("highlight");
        }
      });
    }

    /* =========================================================
       DOCUMENT GRID
    ========================================================= */

    function renderDocsGrid() {
      const grid = $("docsGrid");
      grid.innerHTML = "";

      Object.keys(DOCS_DATA).forEach(code => {
        const doc = DOCS_DATA[code];
        const count = userInventory[code] || 0;

        const item = document.createElement("div");
        item.className = "doc-item";
        item.id = `doc-item-${code}`;

        item.innerHTML = `
          <div class="doc-icon-title">
            <img src="${doc.file}" alt="${doc.name}" onerror="this.src='https://via.placeholder.com/70?text=${code}'">
            <div class="doc-name">${doc.name}</div>
          </div>

          <div class="doc-counters">
            <div class="doc-counter-group">
              <span class="counter-label">보유:</span>
              <input type="number" min="0" class="doc-input" value="${count}" data-code="${code}">
            </div>
            <div class="doc-req" id="req-${code}">필요: 0</div>
          </div>
        `;

        const input = item.querySelector(".doc-input");

        input.addEventListener("change", e => {
          userInventory[code] = parseInt(e.target.value) || 0;
          saveStore("eft_user_inventory", userInventory);
          calculateRequirements();
        });

        input.addEventListener("click", e => e.stopPropagation());
        item.addEventListener("click", () => handleDocClick(code));

        grid.appendChild(item);
      });
    }

    /* =========================================================
       SEASON NAME
    ========================================================= */

    function extractSeasonName(doc) {
      const candidates = [];

      if (doc.title) candidates.push(doc.title);

      doc.querySelectorAll("h1, h2, h3, h4, .mw-parser-output p, .mw-parser-output div").forEach(el => {
        const text = cleanText(el);
        if (text) candidates.push(text);
      });

      candidates.push((doc.body?.innerText || "").replace(/\s+/g, " "));

      // 예: Season 1 - "KORD BREACH"  /  Season 1 - KORD BREACH
      for (const candidate of candidates) {
        const seasonNumber = candidate.match(/\bSeason\s+(\d+)\b/i)?.[1];
        if (!seasonNumber) continue;

        let match = candidate.match(/\bSeason\s+\d+\s*[-–—:]\s*["“”']([^"“”']+)["“”']/i);
        if (match) return `Season ${seasonNumber} - "${match[1].trim()}"`;

        match = candidate.match(/\bSeason\s+\d+\s*[-–—:]\s*([^|\n\r]+)/i);
        if (match) {
          const name = match[1].trim().replace(/[.!,:;]+$/, "");
          if (name && name.length < 100) return `Season ${seasonNumber} - "${name}"`;
        }
      }

      return "";
    }

    function setSeasonName(seasonName) {
      const el = $("seasonName");
      if (el) el.textContent = seasonName ? `(${seasonName})` : "";
    }

    /* =========================================================
       SEASON END DATE
    ========================================================= */

    /*
     * "... ends on December 7, 2026." 문장을 찾아 종료 시각을 만든다.
     * 종료 시간이 따로 제공되지 않으므로 해당 날짜 23:59:59 (UTC+3)를 사용한다.
     */
    function extractSeasonEndDate(doc) {
      const candidates = [...doc.querySelectorAll("p")].map(cleanText).filter(Boolean);

      if (doc.body) {
        candidates.push((doc.body.innerText || doc.body.textContent || "").replace(/\s+/g, " "));
      }

      const monthMap = {
        january: 0, february: 1, march: 2, april: 3, may: 4, june: 5,
        july: 6, august: 7, september: 8, october: 9, november: 10, december: 11
      };

      for (const text of candidates) {
        const match = text.match(/\bends\s+on\s+([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})\b/i);
        if (!match) continue;

        const month = monthMap[match[1].toLowerCase()];
        const day = parseInt(match[2], 10);
        const year = parseInt(match[3], 10);

        if (month === undefined || !day || !year) continue;

        // UTC+3의 23:59:59 = UTC 20:59:59
        return Date.UTC(year, month, day, 20, 59, 59, 999);
      }

      return null;
    }

    function setSeasonEndTimestamp(timestamp) {
      seasonEndTimestamp = timestamp && Number.isFinite(timestamp) ? timestamp : null;
      updateSeasonCountdown();
    }

    /* =========================================================
       COUNTDOWN
    ========================================================= */

    function updateSeasonCountdown() {
      const countdownEl = $("seasonCountdown");
      if (!countdownEl) return;

      const diff = seasonEndTimestamp ? seasonEndTimestamp - Date.now() : 0;

      if (diff <= 0) {
        countdownEl.textContent = "00 : 00 : 00 : 00";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const pad = n => String(n).padStart(2, "0");

      countdownEl.textContent = [
        Math.floor(totalSeconds / 86400),
        Math.floor((totalSeconds % 86400) / 3600),
        Math.floor((totalSeconds % 3600) / 60),
        totalSeconds % 60
      ].map(pad).join(" : ");
    }

    function startSeasonCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);

      updateSeasonCountdown();
      countdownInterval = setInterval(updateSeasonCountdown, 1000);
    }

    /* =========================================================
       FANDOM DATA FETCH
    ========================================================= */

    async function fetchFandomHtml() {
      const targetPage = "BattlePass";
      const wikiUrl = `https://escapefromtarkov.fandom.com/wiki/${targetPage}`;
      const page = encodeURIComponent(targetPage);

      const apiUrls = [
        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${page}&prop=text&format=json&origin=*`,
        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${page}&prop=text&format=json&origin=https://escapefromtarkov.fandom.com`
      ];

      const proxyUrls = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(wikiUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(wikiUrl)}`
      ];

      // 1. Fandom API
      for (const url of apiUrls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;

          const data = await res.json();
          const apiHtml = data?.parse?.text?.["*"];
          if (apiHtml) return apiHtml;
        } catch (e) {
          console.warn("Fandom API attempt failed:", e);
        }
      }

      // 2. CORS proxy fallback
      for (const url of proxyUrls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;

          const html = await res.text();
          if (html && html.includes("<table")) return html;
        } catch (e) {
          console.warn("Fandom proxy attempt failed:", e);
        }
      }

      return "";
    }

    function findBattlePassTable(doc) {
      const tables = [...doc.querySelectorAll("table.wikitable, table")];
      if (tables.length === 0) return null;

      return tables.find(table => {
        const text = cleanText(table).toLowerCase();

        return (
          text.includes("level") &&
          text.includes("price") &&
          (text.includes("battle points") || text.includes("price (bp)"))
        );
      }) || tables[0];
    }

    function parseBattlePassRows(table) {
      const getCells = tr => [...tr.querySelectorAll(":scope > th, :scope > td")];
      const isPriceHeader = text => /^price(?:\s*\(bp\))?$/i.test(text);
      const rows = [...table.querySelectorAll("tr")];

      // 가격 열 위치는 헤더 행에서 한 번만 찾는다.
      let priceIndex = -1;
      const headerRow = rows.find(r => getCells(r).some(c => isPriceHeader(cleanText(c))));

      if (headerRow) {
        priceIndex = getCells(headerRow)
          .map(c => cleanText(c).toLowerCase())
          .findIndex(v => v === "price (bp)" || v === "price");
      }

      const parsedPages = [];
      let currentPage = null;
      let pageCount = 0;
      let rewardIndex = 0;

      const startPage = number => {
        currentPage = { page: number, req: "", rewards: [] };
        parsedPages.push(currentPage);
      };

      rows.forEach(tr => {
        const cells = getCells(tr);
        if (cells.length < 3) return;

        const cellText = cells.map(cleanText);
        const rowText = cellText.join(" ");

        // 헤더 행 제외
        if (/^level$/i.test(cellText[0]) || cellText.some(isPriceHeader)) return;

        // Page 구분
        const pageMatch = rowText.match(/\bPage\s+(\d+)\b/i);

        if (pageMatch) {
          pageCount = Number(pageMatch[1]) || pageCount + 1;
          startPage(pageCount);
        }

        // Page 표시가 없는 비정상 구조 대비
        if (!currentPage) {
          pageCount++;
          startPage(pageCount);
        }

        // 보상 이름
        const nameCell = cells[2] || cells.find((c, i) => i > 1 && (c.innerText || "").trim());
        const rewardName = cleanText(nameCell);

        if (!rewardName || /^(name|type)$/i.test(rewardName)) return;

        // 아이콘
        const imgEl = cells[1]?.querySelector("img") || cells.find(c => c.querySelector("img"))?.querySelector("img");

        const iconSrc = imgEl
          ? imgEl.getAttribute("data-src") || imgEl.getAttribute("data-lazy-src") || imgEl.getAttribute("src") || ""
          : "";

        // 가격
        const priceText = priceIndex >= 0
          ? cellText[priceIndex]
          : cellText.slice(3).reverse().find(v => /^\d+$/.test(v)) || "1";

        const priceMatch = String(priceText).match(/\d+/);
        const price = priceMatch ? Math.max(1, parseInt(priceMatch[0], 10)) : 1;

        rewardIndex++;

        currentPage.rewards.push({
          id: `p${currentPage.page}_${rewardIndex}`,
          name: rewardName,
          price,
          defaultCosts: { FD: price },
          icon: iconSrc
        });
      });

      return { pages: parsedPages.filter(p => p.rewards.length > 0), rewardCount: rewardIndex };
    }

    async function fetchFandomBattlePass() {
      try {
        const htmlText = await fetchFandomHtml();

        if (!htmlText) {
          console.warn("Fandom BattlePass 데이터를 가져오지 못했습니다. 기본 데이터를 유지합니다.");
          return;
        }

        const doc = new DOMParser().parseFromString(htmlText, "text/html");

        // 시즌 이름
        const seasonName = extractSeasonName(doc);
        if (seasonName) setSeasonName(seasonName);

        // 시즌 종료 시각
        const seasonEnd = extractSeasonEndDate(doc);

        if (seasonEnd) {
          setSeasonEndTimestamp(seasonEnd);
          console.info("시즌 종료 시간:", new Date(seasonEnd).toISOString());
        } else {
          console.warn("시즌 종료 날짜를 찾지 못했습니다.");
        }

        // 시즌 식별값: 시즌 이름을 우선 사용하고, 없으면 종료 날짜로 대체한다.
        currentSeasonKey = seasonName || (seasonEnd ? `end-${seasonEnd}` : "");

        // 보상 테이블
        const table = findBattlePassTable(doc);

        if (!table) {
          console.warn("BattlePass 테이블을 찾지 못했습니다.");
          return;
        }

        const { pages, rewardCount } = parseBattlePassRows(table);

        if (pages.length > 0) {
          roadmapPages = pages;
          console.info(`BattlePass 파싱 완료: ${pages.length}개 페이지, ${rewardCount}개 보상`);
        } else {
          console.warn("BattlePass 보상 데이터를 찾지 못했습니다. 기본 데이터를 유지합니다.");
        }
      } catch (err) {
        console.warn("Fandom Wiki fetch/parse failed, fallback to default.", err);
      }
    }

    /* =========================================================
       PAGE CLAIM STATE
    ========================================================= */

    function saveClaimed() {
      saveStore("eft_claimed_rewards", claimedRewards);
    }

    function isPageFullyClaimed(page) {
      return !!page?.rewards?.length && page.rewards.every(r => !!claimedRewards[r.id]);
    }

    /*
     * 미획득 보상이 하나라도 있으면 전체 획득 처리,
     * 모두 획득 상태라면 전체 미획득 처리
     */
    function togglePageClaim(page) {
      if (!page?.rewards) return;

      const fullyClaimed = isPageFullyClaimed(page);

      page.rewards.forEach(reward => {
        if (fullyClaimed) delete claimedRewards[reward.id];
        else claimedRewards[reward.id] = true;
      });

      saveClaimed();
      renderRoadmap();
      calculateRequirements();
    }

    function toggleRewardClaim(reward) {
      if (claimedRewards[reward.id]) delete claimedRewards[reward.id];
      else claimedRewards[reward.id] = true;

      saveClaimed();
      renderRoadmap();
      calculateRequirements();
    }

    /* =========================================================
       SCROLL
    ========================================================= */

    function findFirstUnclaimedPageIndex() {
      const index = roadmapPages.findIndex(page => page.rewards.some(r => !claimedRewards[r.id]));

      // 전부 획득했다면 마지막 페이지
      return index >= 0 ? index : Math.max(0, roadmapPages.length - 1);
    }

    function scrollToFirstUnclaimedPage(behavior = "smooth") {
      const container = $("roadmapContainer");
      if (!container || roadmapPages.length === 0) return;

      const targetColumn = container.children[findFirstUnclaimedPageIndex()];
      if (!targetColumn) return;

      // 컨테이너 좌측 padding(15px)만큼 여유를 둔다.
      container.scrollTo({ left: Math.max(0, targetColumn.offsetLeft - 15), behavior });
    }

    /*
     * 마우스 휠(세로) 입력을 가로 스크롤로 변환한다.
     * WHEEL_SPEED 배율로 이동 범위를 늘리고, 목표 위치까지 부드럽게 이동한다.
     */
    function setupHorizontalWheel() {
      const container = $("roadmapContainer");
      if (!container) return;

      let target = container.scrollLeft;
      let rafId = null;

      const animate = () => {
        const diff = target - container.scrollLeft;

        if (Math.abs(diff) < 1) {
          container.scrollLeft = target;
          rafId = null;
          return;
        }

        let step = diff * WHEEL_EASING;
        if (Math.abs(step) < 1) step = Math.sign(diff);

        container.scrollLeft += step;
        rafId = requestAnimationFrame(animate);
      };

      container.addEventListener("wheel", event => {
        // Shift / Ctrl + 휠은 브라우저 기본 동작 유지
        if (event.shiftKey || event.ctrlKey) return;

        event.preventDefault();

        // deltaMode: 0 = pixel, 1 = line, 2 = page
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? container.clientWidth : 1;
        const raw = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
        const max = container.scrollWidth - container.clientWidth;

        if (!rafId) target = container.scrollLeft;

        target = Math.max(0, Math.min(max, target + raw * unit * WHEEL_SPEED));

        if (!rafId) rafId = requestAnimationFrame(animate);
      }, { passive: false });
    }

    /* =========================================================
       ROADMAP RENDER
    ========================================================= */

    function createRewardCard(reward) {
      const card = document.createElement("div");
      const isClaimed = !!claimedRewards[reward.id];
      const costs = getCosts(reward);

      card.className = `reward-card ${isClaimed ? "claimed" : ""}`;

      const costTags = Object.keys(costs)
        .filter(code => costs[code] > 0 && DOCS_DATA[code])
        .map(code => `
          <span class="cost-tag">
            <img src="${DOCS_DATA[code].file}" onerror="this.style.display='none'">
            ${costs[code]} ${code}
          </span>
        `)
        .join("");

      card.innerHTML = `
        <div class="reward-title-row">
          <div class="reward-title" title="${reward.name}">${reward.name}</div>
          <span class="edit-btn" title="재화 수정">✏️</span>
        </div>

        <div class="reward-img-container">
          <img src="${reward.icon}" alt="${reward.name}" onerror="this.src='https://via.placeholder.com/80?text=Reward'">
        </div>

        <div class="reward-costs">${costTags}</div>
      `;

      card.querySelector(".edit-btn").addEventListener("click", event => {
        event.stopPropagation();
        openEditModal(reward.id);
      });

      // 보상 클릭 시 부모 Page 토글이 실행되지 않도록 전파 차단
      card.addEventListener("click", event => {
        event.stopPropagation();
        toggleRewardClaim(reward);
      });

      return card;
    }

    function createPageColumn(p) {
      const fullyClaimed = isPageFullyClaimed(p);

      const col = document.createElement("div");
      col.className = "roadmap-column page-toggleable";
      if (fullyClaimed) col.classList.add("page-claimed");

      // 페이지 영역 클릭 → 페이지 전체 보상 토글
      col.addEventListener("click", () => togglePageClaim(p));

      const header = document.createElement("div");
      header.className = "column-header";
      header.innerHTML = `
        <div class="page-title-area">
          <span class="page-claim-indicator"></span>
          <span>Page ${p.page}</span>
        </div>
        <span class="page-req">${p.req || ""}</span>
        <span class="page-status-text">${fullyClaimed ? "CLAIMED" : "UNCLAIMED"}</span>
      `;
      col.appendChild(header);

      const body = document.createElement("div");
      body.className = "column-body";

      // body의 빈 공간 클릭은 페이지 토글로 전달하지 않는다.
      body.addEventListener("click", event => {
        if (event.target === body) event.stopPropagation();
      });

      p.rewards.forEach(reward => body.appendChild(createRewardCard(reward)));

      col.appendChild(body);
      return col;
    }

    function renderRoadmap() {
      const container = $("roadmapContainer");
      const previousScrollLeft = container.scrollLeft;

      container.innerHTML = "";
      roadmapPages.forEach(p => container.appendChild(createPageColumn(p)));

      // 최초 렌더링은 첫 미획득 위치로 이동, 이후에는 보고 있던 위치를 유지한다.
      requestAnimationFrame(() => {
        if (previousScrollLeft === 0) scrollToFirstUnclaimedPage("auto");
        else container.scrollLeft = previousScrollLeft;
      });
    }

    /* =========================================================
       EDIT MODAL
    ========================================================= */

    function openEditModal(rewardId) {
      let reward = null;

      for (const p of roadmapPages) {
        reward = p.rewards.find(r => r.id === rewardId);
        if (reward) break;
      }

      if (!reward) return;

      currentEditReward = reward;

      $("modalTitle").innerText = `Edit Costs: ${reward.name}`;
      $("maxPriceVal").innerText = reward.price;

      const grid = $("modalGrid");
      const activeCosts = getCosts(reward);

      grid.innerHTML = "";

      Object.keys(DOCS_DATA).forEach(code => {
        const group = document.createElement("div");
        group.className = "modal-input-group";

        group.innerHTML = `
          <label>
            <img src="${DOCS_DATA[code].file}" onerror="this.style.display='none'">
            ${DOCS_DATA[code].name}
          </label>
          <input type="number" min="0" value="${activeCosts[code] || 0}" data-modal-code="${code}">
        `;

        grid.appendChild(group);
      });

      $("editModal").style.display = "flex";
    }

    function closeModal() {
      $("editModal").style.display = "none";
      currentEditReward = null;
    }

    function refreshAfterCostChange() {
      saveStore("eft_user_costs", userCosts);
      closeModal();
      renderRoadmap();
      calculateRequirements();
    }

    $("modalSaveBtn").addEventListener("click", () => {
      if (!currentEditReward) return;

      let sum = 0;
      const newCosts = {};

      document.querySelectorAll("[data-modal-code]").forEach(input => {
        const val = parseInt(input.value) || 0;

        if (val > 0) newCosts[input.getAttribute("data-modal-code")] = val;
        sum += val;
      });

      if (sum > currentEditReward.price) {
        alert(`입력하신 재화의 총합(${sum})이 해당 보상의 필요 총량(${currentEditReward.price})을 초과할 수 없습니다.`);
        return;
      }

      userCosts[currentEditReward.id] = newCosts;
      refreshAfterCostChange();
    });

    $("modalResetBtn").addEventListener("click", () => {
      if (!currentEditReward) return;

      delete userCosts[currentEditReward.id];
      refreshAfterCostChange();
    });

    $("modalCancelBtn").addEventListener("click", closeModal);

    $("editModal").addEventListener("click", event => {
      if (event.target.id === "editModal") closeModal();
    });

    /* =========================================================
       PROGRESS (개별 보상 기준 클레임 수 / 전체 보상 수)
    ========================================================= */

    function updateProgress() {
      const countEl = $("progressCount");
      if (!countEl) return;

      let total = 0;
      let claimed = 0;

      roadmapPages.forEach(p => {
        p.rewards.forEach(r => {
          total++;
          if (claimedRewards[r.id]) claimed++;
        });
      });

      countEl.textContent = `${claimed} / ${total}`;
    }

    /* =========================================================
       REQUIREMENT CALCULATION
    ========================================================= */

    function calculateRequirements() {
      updateProgress();

      const totals = {};
      Object.keys(DOCS_DATA).forEach(code => (totals[code] = 0));

      // 미수령 보상만 합산
      roadmapPages.forEach(p => {
        p.rewards.forEach(r => {
          if (claimedRewards[r.id]) return;

          const costs = getCosts(r);

          Object.keys(costs).forEach(code => {
            if (totals[code] !== undefined) totals[code] += costs[code];
          });
        });
      });

      // 보유량 차감 후 표시
      Object.keys(totals).forEach(code => {
        const remain = Math.max(0, totals[code] - (userInventory[code] || 0));
        const reqEl = $(`req-${code}`);
        if (!reqEl) return;

        reqEl.innerText = `필요: ${remain}`;
        reqEl.style.color = remain === 0 ? "#4caf50" : "#ff5252";
      });
    }

    /* =========================================================
       START
    ========================================================= */

    init();
  </script>

</body>
</html>

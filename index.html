<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Battle Pass Tracker</title>
  <style>
    :root {
      --bg-color: #121417;
      --panel-bg: #1e2228;
      --card-bg: #282c34;
      --border-color: #3b404a;
      --accent-color: #e5b35c;
      --highlight-color: #ff9800;
      --text-color: #e0e0e0;
      --text-dim: #9e9e9e;
      --claimed-bg: rgba(76, 175, 80, 0.25);
      --claimed-border: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header (1번) */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      height: 60px;
      flex-shrink: 0;
    }

    header img {
      height: 35px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    #seasonName {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      margin-left: 6px;
      letter-spacing: 0;
    }

    /* Main Content Layout */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar: Map Selector (스크롤 제거 및 한눈에 보기) */
    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden; /* 스크롤 제거 */
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .map-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 5px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1; /* 높이 균등 분배 */
      min-height: 0;
    }

    .map-card:hover {
      border-color: var(--border-color);
      background-color: #323741;
    }

    .map-card.active, .map-card.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
      background-color: #3a3226;
    }

    .map-name {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .map-docs {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .doc-badge {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* Center Content */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Central Roadmap Scroll */
    .roadmap-scroll {
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 15px;
      display: flex;
      gap: 15px;
      background-color: #16181d;
    }

    .roadmap-column {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .column-header {
      background-color: var(--card-bg);
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* 세로 스크롤 제거 및 2열 Grid 적용 */
    .column-body {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2열 배치 */
      gap: 10px;
      overflow-y: hidden; /* 컬럼 내 세로 스크롤 제거 */
      flex: 1;
      align-content: start;
    }

    /* 보상 카드 (클릭 가능) */
    .reward-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .reward-card:hover {
      border-color: #555d6d;
    }

    /* 수령 완료 상태 (초록색 불투명 음영) */
    .reward-card.claimed {
      background-color: var(--claimed-bg);
      border-color: var(--claimed-border);
      box-shadow: inset 0 0 10px rgba(76, 175, 80, 0.3);
    }

    .reward-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reward-title {
      font-weight: 600;
      font-size: 0.8rem;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100px;
    }

    .edit-btn {
      cursor: pointer;
      color: #ff5252;
      font-size: 0.85rem;
      transition: transform 0.1s;
    }

    .edit-btn:hover {
      transform: scale(1.2);
    }

    .reward-img-container {
      width: 100%;
      height: 70px;
      background-color: rgba(0,0,0,0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reward-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .reward-costs {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .cost-tag {
      font-size: 0.7rem;
      background-color: #121417;
      border: 1px solid var(--border-color);
      padding: 1px 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Bottom Panel: Inventory & Requirements */
    .bottom-panel {
      height: 220px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      min-height: 0;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .docs-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;
      flex: 1;
      min-height: 0;
      align-items: center;
    }

    .doc-item {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      height: 156px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .doc-item.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
      background-color: #3a3226;
    }

    .doc-icon-title {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .doc-icon-title img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .doc-name {
      font-size: 0.85rem;
      color: var(--text-color);
      text-align: left;
      font-weight: 500;
      word-break: keep-all;
    }

    /* 필요량/보유량 UI 커스텀 (크기 확대 및 중앙 정렬) */
    .doc-counters {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 4px;
    }

    .doc-counter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .counter-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: bold;
    }

    .doc-input {
      width: 48px;
      height: 26px;
      background-color: #121417;
      border: 1px solid var(--border-color);
      color: #fff;
      text-align: center;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .doc-req {
      font-size: 1rem;
      color: #ff5252;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    @media (max-width: 1100px) {
      .docs-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .bottom-panel {
        height: 250px;
      }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background-color: var(--panel-bg);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 20px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal h3 {
      color: var(--accent-color);
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .modal-input-group label {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .modal-input-group input {
      width: 45px;
      background-color: #121417;
      border: 1px solid var(--border-color);
      color: #fff;
      text-align: center;
      padding: 2px;
      border-radius: 3px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-save { background-color: #4caf50; color: #fff; }
    .btn-cancel { background-color: #f44336; color: #fff; }
    .btn-reset { background-color: #555; color: #fff; }
  </style>
</head>
<body>

  <!-- 1. 좌상단 로고 및 제목 -->
  <header>
    <a href="https://www.escapefromtarkov.com/" target="_blank">
      <img src="https://www.escapefromtarkov.com/build-eft-site/_nuxt/logo.WO0wViWU.webp" alt="Escape from Tarkov">
    </a>
    <h1>Tarkov Battle Pass Tracker <span id="seasonName"></span></h1>
  </header>

  <div class="main-container">
    <!-- 2. 좌중단 : 맵 선택 (스크롤 제거) -->
    <div class="sidebar" id="mapList">
      <h2>맵 목록</h2>
      <!-- JS로 동적 생성 -->
    </div>

    <!-- 중앙 영역 -->
    <div class="content-area">
      <!-- 3. 중앙상단 : 배틀패스 보상 로드맵 (페이지별 2행 Grid) -->
      <div class="roadmap-scroll" id="roadmapContainer">
        <!-- JS로 동적 생성 -->
      </div>

      <!-- 4. 중앙하단 : 보유 및 필요 재화 계산 -->
      <div class="bottom-panel">
        <div class="panel-title">문서 보유량 및 필요 수량</div>
        <div class="docs-grid" id="docsGrid">
          <!-- JS로 동적 생성 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 편집 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle">Edit Costs</h3>
      <div style="font-size: 0.8rem; color: var(--text-dim); text-align: center;" id="modalPriceInfo">
        해당 보상의 최대 재화 합계: <span id="maxPriceVal">0</span>
      </div>
      <div class="modal-grid" id="modalGrid">
        <!-- JS로 동적 생성 -->
      </div>
      <div class="modal-actions">
        <button class="btn btn-reset" id="modalResetBtn">기본값</button>
        <button class="btn btn-cancel" id="modalCancelBtn">취소</button>
        <button class="btn btn-save" id="modalSaveBtn">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 문서 정의 (한글 표기 및 코드/파일명 매핑)
    const DOCS_DATA = {
      "FD": { name: "회계 문서", file: "FD.webp" },
      "PD": { name: "프로젝트 문서", file: "PD.webp" },
      "TD": { name: "테스트 문서", file: "TD.webp" },
      "MD": { name: "의료 문서", file: "MD.webp" },
      "PMC": { name: "PMC 인사 문서", file: "PMC.webp" },
      "BP": { name: "설계도", file: "BP.webp" },
      "UD": { name: "사용자 문서", file: "UD.webp" },
      "Tech": { name: "장비 문서", file: "Tech.webp" }
    };

    // 맵 정의
    const MAPS_DATA = [
      { name: "커스텀", docs: ["FD", "PD"] },
      { name: "타르코프 시내", docs: ["FD", "UD"] },
      { name: "인터체인지", docs: ["FD", "BP"] },
      { name: "리저브", docs: ["PMC", "PD"] },
      { name: "등대", docs: ["PMC", "Tech"] },
      { name: "쇄빙선", docs: ["PMC", "TD"] },
      { name: "공장", docs: ["PD", "BP"] },
      { name: "미궁", docs: ["BP", "MD"] },
      { name: "해안선", docs: ["TD", "Tech"] },
      { name: "삼림", docs: ["TD", "Tech"] },
      { name: "그라운드 제로", docs: ["UD", "MD"] },
      { name: "실험실", docs: ["UD", "MD"] }
    ];

    // 유저 로컬 스토리지 데이터
    let userCosts = JSON.parse(localStorage.getItem("eft_user_costs") || "{}");
    let userInventory = JSON.parse(localStorage.getItem("eft_user_inventory") || "{}");
    let claimedRewards = JSON.parse(localStorage.getItem("eft_claimed_rewards") || "{}");

    // 기본 로드맵 데이터
    let roadmapPages = [
      {
        page: 1,
        req: "4/5",
        rewards: [
          { id: "p1_1", name: "Dogtag", price: 5, defaultCosts: { "FD": 1 }, icon: "" },
          { id: "p1_2", name: "TarCoin", price: 3, defaultCosts: { "PD": 2, "BP": 1 }, icon: "" },
          { id: "p1_3", name: "Poster", price: 3, defaultCosts: { "TD": 2, "UD": 1 }, icon: "" },
          { id: "p1_4", name: "Crate", price: 3, defaultCosts: { "BP": 2, "FD": 1 }, icon: "" }
        ]
      }
    ];

    let selectedMap = null;
    let selectedDoc = null;
    let currentEditReward = null;

    // 초기화 함수
    async function init() {
      renderMapList();
      renderDocsGrid();
      await fetchFandomBattlePass();
      renderRoadmap();
      calculateRequirements();
    }

    // 2. 맵 목록 렌더링
    function renderMapList() {
      const mapListEl = document.getElementById("mapList");
      mapListEl.innerHTML = "<h2>맵 목록</h2>";

      MAPS_DATA.forEach(map => {
        const card = document.createElement("div");
        card.className = `map-card ${selectedMap === map.name ? 'active' : ''}`;
        card.id = `map-${map.name}`;
        
        const docBadges = map.docs.map(code => `<span class="doc-badge">${DOCS_DATA[code].name}</span>`).join("");
        card.innerHTML = `
          <div class="map-name">${map.name}</div>
          <div class="map-docs">${docBadges}</div>
        `;

        card.addEventListener("click", () => handleMapClick(map));
        mapListEl.appendChild(card);
      });
    }

    function handleMapClick(map) {
      if (selectedMap === map.name) {
        selectedMap = null;
      } else {
        selectedMap = map.name;
      }
      selectedDoc = null;
      updateHighlights();
    }

    function handleDocClick(docCode) {
      if (selectedDoc === docCode) {
        selectedDoc = null;
      } else {
        selectedDoc = docCode;
      }
      selectedMap = null;
      updateHighlights();
    }

    function updateHighlights() {
      MAPS_DATA.forEach(map => {
        const el = document.getElementById(`map-${map.name}`);
        if (!el) return;
        el.classList.remove("active", "highlight");
        
        if (selectedMap === map.name) {
          el.classList.add("active");
        } else if (selectedDoc && map.docs.includes(selectedDoc)) {
          el.classList.add("highlight");
        }
      });

      Object.keys(DOCS_DATA).forEach(code => {
        const el = document.getElementById(`doc-item-${code}`);
        if (!el) return;
        el.classList.remove("highlight");

        if (selectedDoc === code) {
          el.classList.add("highlight");
        } else if (selectedMap) {
          const mapObj = MAPS_DATA.find(m => m.name === selectedMap);
          if (mapObj && mapObj.docs.includes(code)) {
            el.classList.add("highlight");
          }
        }
      });
    }

    // 4. 보유 문서 및 필요 수량 UI 렌더링
    function renderDocsGrid() {
      const grid = document.getElementById("docsGrid");
      grid.innerHTML = "";

      Object.keys(DOCS_DATA).forEach(code => {
        const doc = DOCS_DATA[code];
        const count = userInventory[code] || 0;

        const item = document.createElement("div");
        item.className = "doc-item";
        item.id = `doc-item-${code}`;

        item.innerHTML = `
          <div class="doc-icon-title">
            <img src="${doc.file}" alt="${doc.name}" onerror="this.src='https://via.placeholder.com/70?text=${code}'">
            <div class="doc-name">${doc.name}</div>
          </div>
          <div class="doc-counters">
            <div class="doc-counter-group">
              <span class="counter-label">보유:</span>
              <input type="number" min="0" class="doc-input" value="${count}" data-code="${code}">
            </div>
            <div class="doc-req" id="req-${code}">필요: 0</div>
          </div>
        `;

        const input = item.querySelector(".doc-input");
        input.addEventListener("change", (e) => {
          userInventory[code] = parseInt(e.target.value) || 0;
          localStorage.setItem("eft_user_inventory", JSON.stringify(userInventory));
          calculateRequirements(); // 보유량 변경 시 필요량 차감 재계산
        });
        input.addEventListener("click", (e) => e.stopPropagation());

        item.addEventListener("click", () => handleDocClick(code));
        grid.appendChild(item);
      });
    }

    // 파싱된 페이지에서 시즌명 추출
    function extractSeasonName(doc, htmlText) {
      const candidates = [];

      // 문서 제목 / heading / 일반 텍스트 순서로 후보 수집
      if (doc.title) candidates.push(doc.title);
      doc.querySelectorAll('h1, h2, h3, h4, .mw-parser-output p, .mw-parser-output div').forEach(el => {
        const text = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
        if (text) candidates.push(text);
      });
      candidates.push((doc.body?.innerText || '').replace(/\s+/g, ' '));

      // 예: Season 1 - "KORD BREACH" / Season 1 - KORD BREACH
      for (const candidate of candidates) {
        const seasonNumber = candidate.match(/\bSeason\s+(\d+)\b/i)?.[1];
        if (!seasonNumber) continue;

        // 따옴표가 있는 경우: 시즌명만 정확히 추출
        let match = candidate.match(/\bSeason\s+\d+\s*[-–—:]\s*[\"“”']([^\"“”']+)[\"“”']/i);
        if (match) {
          return `Season ${seasonNumber} - \"${match[1].trim()}\"`;
        }

        // 따옴표가 없는 경우도 대응
        match = candidate.match(/\bSeason\s+\d+\s*[-–—:]\s*([^|\n\r]+)/i);
        if (match) {
          const name = match[1].trim().replace(/[.!,:;]+$/, '');
          if (name && name.length < 100) return `Season ${seasonNumber} - \"${name}\"`;
        }
      }

      return '';
    }

    function setSeasonName(seasonName) {
      const seasonEl = document.getElementById('seasonName');
      if (seasonEl) seasonEl.textContent = seasonName ? `(${seasonName})` : '';
    }

    // 팬덤 위키 데이터 파싱
    async function fetchFandomBattlePass() {
      const targetPage = "BattlePass";

      // Fandom 페이지 HTML 자체를 가져오는 방식은 CORS 프록시 상태나
      // 위키의 HTML 구조 변경에 따라 갑자기 실패할 수 있다.
      // MediaWiki Action API를 우선 사용하고, 실패하면 프록시 HTML을 시도한다.
      const apiUrls = [
        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${encodeURIComponent(targetPage)}&prop=text&format=json&origin=*`,
        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${encodeURIComponent(targetPage)}&prop=text&format=json&origin=https://escapefromtarkov.fandom.com`
      ];

      const proxyUrls = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://escapefromtarkov.fandom.com/wiki/${targetPage}`)}`,
        `https://corsproxy.io/?${encodeURIComponent(`https://escapefromtarkov.fandom.com/wiki/${targetPage}`)}`
      ];

      try {
        let htmlText = "";

        // 1) Fandom MediaWiki API
        for (const url of apiUrls) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) continue;

            const data = await res.json();
            const apiHtml = data?.parse?.text?.["*"];
            if (apiHtml) {
              htmlText = apiHtml;
              break;
            }
          } catch (e) {
            console.warn("Fandom API attempt failed:", e);
          }
        }

        // 2) API가 막힌 경우 CORS 프록시 fallback
        if (!htmlText) {
          for (const url of proxyUrls) {
            try {
              const res = await fetch(url, { cache: "no-store" });
              if (!res.ok) continue;

              htmlText = await res.text();
              if (htmlText && htmlText.includes("<table")) break;
            } catch (e) {
              console.warn("Fandom proxy attempt failed:", e);
            }
          }
        }

        if (!htmlText) {
          console.warn("Fandom BattlePass 데이터를 가져오지 못했습니다. 기본 데이터를 유지합니다.");
          return;
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // 시즌명도 같은 파싱 결과에서 추출하여 제목에 표시
        const seasonName = extractSeasonName(doc, htmlText);
        if (seasonName) setSeasonName(seasonName);

        // API 응답의 <table> 또는 일반 페이지의 wikitable 모두 대응
        const tables = [...doc.querySelectorAll("table.wikitable, table")];
        if (tables.length === 0) {
          console.warn("BattlePass 테이블을 찾지 못했습니다.");
          return;
        }

        // Level / Icon / Name / Type / Price(BP) 열을 가진 실제 BattlePass 표를 찾는다.
        const targetTable = tables.find(table => {
          const text = (table.innerText || table.textContent || "").replace(/\s+/g, " ").toLowerCase();
          return text.includes("level") &&
                 text.includes("price") &&
                 (text.includes("battle points") || text.includes("price (bp)"));
        }) || tables[0];

        const rows = [...targetTable.querySelectorAll("tr")];
        const parsedPages = [];
        let currentPage = null;
        let pageCount = 0;
        let rewardIndex = 0;

        rows.forEach((tr) => {
          const cells = [...tr.querySelectorAll(":scope > th, :scope > td")];
          if (cells.length < 3) return;

          const cellText = cells.map(c => (c.innerText || c.textContent || "").replace(/\s+/g, " ").trim());
          const rowText = cellText.join(" ");

          // 헤더 행
          if (/^level$/i.test(cellText[0]) ||
              cellText.some(v => /^price(?:\s*\(bp\))?$/i.test(v))) {
            return;
          }

          // 첫 번째 열에 "Page N"이 포함된 행이 새 페이지의 시작이다.
          const pageMatch = rowText.match(/\bPage\s+(\d+)\b/i);
          if (pageMatch) {
            pageCount = Number(pageMatch[1]) || (pageCount + 1);

            currentPage = {
              page: pageCount,
              req: "",
              rewards: []
            };
            parsedPages.push(currentPage);
          }

          // Page 표시가 첫 보상보다 먼저 나오지 않는 비정상 구조도 처리
          if (!currentPage) {
            pageCount++;
            currentPage = { page: pageCount, req: "", rewards: [] };
            parsedPages.push(currentPage);
          }

          // 현재 BattlePass 표는 [Level, Icon, Name, Type, Price, ...] 구조다.
          // rowspan 때문에 Icon/Name 셀이 비어 있는 경우에도 실제 텍스트가 있는 셀을 찾아낸다.
          const nameCell = cells[2] || cells.find((c, i) => i > 1 && (c.innerText || "").trim());
          const rewardName = (nameCell?.innerText || nameCell?.textContent || "").replace(/\s+/g, " ").trim();

          if (!rewardName || /^(name|type)$/i.test(rewardName)) return;

          const imgEl =
            cells[1]?.querySelector("img") ||
            cells.find(c => c.querySelector("img"))?.querySelector("img");

          const iconSrc = imgEl
            ? (imgEl.getAttribute("data-src") ||
               imgEl.getAttribute("data-lazy-src") ||
               imgEl.getAttribute("src") || "")
            : "";

          // 가격 열은 헤더명을 기준으로 찾고, 실패하면 숫자 셀 중 마지막 값을 사용한다.
          let priceIndex = -1;
          const headerRow = rows.find(r =>
            [...r.querySelectorAll(":scope > th, :scope > td")]
              .some(c => /^price(?:\s*\(bp\))?$/i.test((c.innerText || c.textContent || "").trim()))
          );

          if (headerRow) {
            const headers = [...headerRow.querySelectorAll(":scope > th, :scope > td")]
              .map(c => (c.innerText || c.textContent || "").replace(/\s+/g, " ").trim().toLowerCase());
            priceIndex = headers.findIndex(v => v === "price (bp)" || v === "price");
          }

          let priceText = priceIndex >= 0
            ? cellText[priceIndex]
            : cellText.slice(3).reverse().find(v => /^\d+$/.test(v)) || "1";

          // "5 BP" 같은 표기도 대응
          const priceMatch = String(priceText).match(/\d+/);
          const price = priceMatch ? Math.max(1, parseInt(priceMatch[0], 10)) : 1;

          rewardIndex++;
          currentPage.rewards.push({
            id: `p${currentPage.page}_${rewardIndex}`,
            name: rewardName,
            price,
            defaultCosts: { "FD": price },
            icon: iconSrc
          });
        });

        // 보상이 없는 페이지 제거
        const validPages = parsedPages.filter(p => p.rewards.length > 0);

        if (validPages.length > 0) {
          roadmapPages = validPages;
          console.info(`BattlePass 파싱 완료: ${validPages.length}개 페이지, ${rewardIndex}개 보상`);
        } else {
          console.warn("BattlePass 보상 데이터를 찾지 못했습니다. 기본 데이터를 유지합니다.");
        }
      } catch (err) {
        console.warn("Fandom Wiki fetch/parse failed, fallback to default.", err);
      }
    }

    // 3. 로드맵 UI 렌더링 (2열 배치 및 클릭으로 수령 처리)
    function renderRoadmap() {
      const container = document.getElementById("roadmapContainer");
      container.innerHTML = "";

      roadmapPages.forEach(p => {
        const col = document.createElement("div");
        col.className = "roadmap-column";

        const header = document.createElement("div");
        header.className = "column-header";
        header.innerHTML = `<span>Page ${p.page}</span><span style="font-size:0.75rem; color:var(--text-dim);">${p.req}</span>`;

        const body = document.createElement("div");
        body.className = "column-body";

        p.rewards.forEach(reward => {
          const card = document.createElement("div");
          const isClaimed = !!claimedRewards[reward.id];
          card.className = `reward-card ${isClaimed ? 'claimed' : ''}`;

          const currentCosts = userCosts[reward.id] || reward.defaultCosts;

          let costTags = "";
          Object.keys(currentCosts).forEach(code => {
            const amt = currentCosts[code];
            if (amt > 0) {
              costTags += `<span class="cost-tag"><img src="${DOCS_DATA[code].file}" style="width:12px;height:12px" onerror="this.style.display='none'"> ${amt} ${code}</span>`;
            }
          });

          card.innerHTML = `
            <div class="reward-title-row">
              <div class="reward-title" title="${reward.name}">${reward.name}</div>
              <span class="edit-btn" onclick="event.stopPropagation(); openEditModal('${reward.id}')">✏️</span>
            </div>
            <div class="reward-img-container">
              <img src="${reward.icon}" alt="${reward.name}" onerror="this.src='https://via.placeholder.com/80?text=Reward'">
            </div>
            <div class="reward-costs">${costTags}</div>
          `;

          // 보상 클릭 토글 (초록 불투명 토글 및 차감 계산 연계)
          card.addEventListener("click", () => {
            if (claimedRewards[reward.id]) {
              delete claimedRewards[reward.id];
            } else {
              claimedRewards[reward.id] = true;
            }
            localStorage.setItem("eft_claimed_rewards", JSON.stringify(claimedRewards));
            renderRoadmap();
            calculateRequirements();
          });

          body.appendChild(card);
        });

        col.appendChild(header);
        col.appendChild(body);
        container.appendChild(col);
      });
    }

    // 모달 관리
    function openEditModal(rewardId) {
      let reward = null;
      for (const p of roadmapPages) {
        const found = p.rewards.find(r => r.id === rewardId);
        if (found) { reward = found; break; }
      }
      if (!reward) return;

      currentEditReward = reward;
      document.getElementById("modalTitle").innerText = `Edit Costs: ${reward.name}`;
      document.getElementById("maxPriceVal").innerText = reward.price;

      const grid = document.getElementById("modalGrid");
      grid.innerHTML = "";

      const activeCosts = userCosts[reward.id] || reward.defaultCosts;

      Object.keys(DOCS_DATA).forEach(code => {
        const val = activeCosts[code] || 0;
        const group = document.createElement("div");
        group.className = "modal-input-group";
        group.innerHTML = `
          <label><img src="${DOCS_DATA[code].file}" style="width:14px;height:14px;" onerror="this.style.display='none'"> ${DOCS_DATA[code].name}</label>
          <input type="number" min="0" value="${val}" data-modal-code="${code}">
        `;
        grid.appendChild(group);
      });

      document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
      currentEditReward = null;
    }

    document.getElementById("modalSaveBtn").addEventListener("click", () => {
      if (!currentEditReward) return;

      const inputs = document.querySelectorAll("[data-modal-code]");
      let sum = 0;
      const newCosts = {};

      inputs.forEach(input => {
        const code = input.getAttribute("data-modal-code");
        const val = parseInt(input.value) || 0;
        if (val > 0) newCosts[code] = val;
        sum += val;
      });

      if (sum > currentEditReward.price) {
        alert(`입력하신 재화의 총합(${sum})이 해당 보상의 필요 총량(${currentEditReward.price})을 초과할 수 없습니다.`);
        return;
      }

      userCosts[currentEditReward.id] = newCosts;
      localStorage.setItem("eft_user_costs", JSON.stringify(userCosts));

      closeModal();
      renderRoadmap();
      calculateRequirements();
    });

    document.getElementById("modalResetBtn").addEventListener("click", () => {
      if (!currentEditReward) return;
      delete userCosts[currentEditReward.id];
      localStorage.setItem("eft_user_costs", JSON.stringify(userCosts));
      closeModal();
      renderRoadmap();
      calculateRequirements();
    });

    document.getElementById("modalCancelBtn").addEventListener("click", closeModal);

    // 4. 자동 소요 문서 및 최종 필요 수량 계산 (수령 상태 및 보유량에 따른 차감 적용)
    function calculateRequirements() {
      const totals = { "FD":0, "PD":0, "TD":0, "MD":0, "PMC":0, "BP":0, "UD":0, "Tech":0 };

      // 미수령(Unclaimed) 보상에 대해서만 필요 재화 합산
      roadmapPages.forEach(p => {
        p.rewards.forEach(r => {
          if (!claimedRewards[r.id]) {
            const costs = userCosts[r.id] || r.defaultCosts;
            Object.keys(costs).forEach(code => {
              if (totals[code] !== undefined) {
                totals[code] += costs[code];
              }
            });
          }
        });
      });

      // 총 필요량에서 보유량(Inventory)만큼 차감 (최소 0)
      Object.keys(totals).forEach(code => {
        const currentInv = userInventory[code] || 0;
        const remainReq = Math.max(0, totals[code] - currentInv);

        const reqEl = document.getElementById(`req-${code}`);
        if (reqEl) {
          reqEl.innerText = `필요: ${remainReq}`;
          // 필요량이 0이면 초록색, 남아있으면 빨간색
          reqEl.style.color = remainReq === 0 ? "#4caf50" : "#ff5252";
        }
      });
    }

    // 실행
    init();
  </script>
</body>
</html>

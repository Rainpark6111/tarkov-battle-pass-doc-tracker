<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Battle Pass Tracker</title>

  <style>
    :root {
      --bg-color: #121417;
      --panel-bg: #1e2228;
      --card-bg: #282c34;
      --border-color: #3b404a;
      --accent-color: #e5b35c;
      --highlight-color: #ff9800;
      --text-color: #e0e0e0;
      --text-dim: #9e9e9e;

      --claimed-bg: rgba(76, 175, 80, 0.25);
      --claimed-border: #4caf50;

      --timer-color: #7ddcff;
      --timer-glow: rgba(93, 211, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      height: 60px;
      flex-shrink: 0;
    }

    header img {
      height: 35px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* =========================================================
       SEASON NAME GLOW
    ========================================================= */

    .season-name {
      color: #ffffff;
      font-weight: 700;
      opacity: 1;
      filter: none;

      text-shadow:
        0 0 2px #ffffff,
        0 0 4px #ffffff,
        0 0 7px rgba(255, 255, 255, 0.95),
        0 0 12px rgba(255, 255, 255, 0.8),
        0 0 18px rgba(255, 255, 255, 0.55);

      animation: seasonGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes seasonGlow {
      from {
        color: #ffffff;
        text-shadow:
          0 0 2px #ffffff,
          0 0 4px #ffffff,
          0 0 7px rgba(255, 255, 255, 0.95),
          0 0 12px rgba(255, 255, 255, 0.8),
          0 0 18px rgba(255, 255, 255, 0.55);
      }

      to {
        color: #ffffff;
        text-shadow:
          0 0 2px #ffffff,
          0 0 5px #ffffff,
          0 0 8px #ffffff,
          0 0 14px rgba(255, 255, 255, 0.95),
          0 0 22px rgba(255, 255, 255, 0.7);
      }
    }

    #seasonName {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      margin-left: 6px;
      letter-spacing: 0;
    }

    /* =========================================================
       SEASON COUNTDOWN
    ========================================================= */

    .season-countdown {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 180px;
      user-select: none;
    }

    .season-countdown-title {
      font-size: 0.58rem;
      color: rgba(125, 220, 255, 0.7);
      letter-spacing: 1.5px;
      margin-bottom: 1px;
      text-transform: uppercase;
    }

    #seasonCountdown {
      color: var(--timer-color);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;

      text-shadow:
        0 0 2px #ffffff,
        0 0 5px var(--timer-glow),
        0 0 9px var(--timer-glow),
        0 0 15px rgba(93, 211, 255, 0.7),
        0 0 24px rgba(93, 211, 255, 0.4);

      animation: countdownGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes countdownGlow {
      from {
        text-shadow:
          0 0 2px #ffffff,
          0 0 5px var(--timer-glow),
          0 0 9px var(--timer-glow),
          0 0 15px rgba(93, 211, 255, 0.7),
          0 0 24px rgba(93, 211, 255, 0.4);
      }

      to {
        text-shadow:
          0 0 2px #ffffff,
          0 0 6px #ffffff,
          0 0 10px var(--timer-glow),
          0 0 18px var(--timer-glow),
          0 0 28px rgba(93, 211, 255, 0.55);
      }
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .map-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 5px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }

    .map-card:hover {
      border-color: var(--border-color);
      background-color: #323741;
    }

    .map-card.active,
    .map-card.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
      background-color: #3a3226;
    }

    .map-name {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .map-docs {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .doc-badge {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* =========================================================
       CENTER
    ========================================================= */

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================================================
       ROADMAP
    ========================================================= */

    .roadmap-scroll {
      flex: 1;
      min-height: 0;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 12px 15px;

      display: flex;
      gap: 15px;

      background-color: #16181d;

      /*
       * 마우스 휠 좌우 스크롤을 부드럽게 사용하기 위한 설정
       */
      scroll-behavior: smooth;

      /*
       * 가로 스크롤바를 조금 더 눈에 띄게 표시
       */
      scrollbar-color: #555d6d #1b1e23;
      scrollbar-width: auto;
    }

    .roadmap-scroll::-webkit-scrollbar {
      height: 10px;
    }

    .roadmap-scroll::-webkit-scrollbar-track {
      background: #1b1e23;
      border-radius: 5px;
    }

    .roadmap-scroll::-webkit-scrollbar-thumb {
      background: #555d6d;
      border-radius: 5px;
    }

    .roadmap-scroll::-webkit-scrollbar-thumb:hover {
      background: #70798a;
    }

    /* =========================================================
       PAGE COLUMN
    ========================================================= */

    .roadmap-column {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;

      width: 320px;
      min-width: 320px;

      display: flex;
      flex-direction: column;
      height: 100%;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    /*
     * 페이지 전체가 클릭 가능한 영역이라는 것을 시각적으로 표시
     */
    .roadmap-column.page-toggleable {
      cursor: pointer;
    }

    .roadmap-column.page-toggleable:hover {
      border-color: #596271;
    }

    /*
     * 해당 Page 전체가 획득 처리된 상태
     */
    .roadmap-column.page-claimed {
      border-color: rgba(76, 175, 80, 0.75);
      box-shadow:
        0 0 8px rgba(76, 175, 80, 0.18),
        inset 0 0 12px rgba(76, 175, 80, 0.06);
    }

    /* =========================================================
       PAGE HEADER
    ========================================================= */

    .column-header {
      background-color: var(--card-bg);
      padding: 10px;

      border-bottom: 1px solid var(--border-color);

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: bold;
      color: var(--accent-color);

      cursor: pointer;
      user-select: none;

      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    .column-header:hover {
      background-color: #323741;
    }

    .page-title-area {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-claim-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555d6d;
      transition: all 0.2s ease;
    }

    .roadmap-column.page-claimed .page-claim-indicator {
      background: #4caf50;
      box-shadow:
        0 0 5px rgba(76, 175, 80, 0.8),
        0 0 10px rgba(76, 175, 80, 0.45);
    }

    .page-status-text {
      font-size: 0.62rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .roadmap-column.page-claimed .page-status-text {
      color: #6fd676;
    }

    /* =========================================================
       COLUMN BODY
    ========================================================= */

    .column-body {
      padding: 10px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      overflow-y: hidden;

      flex: 1;
      align-content: start;
    }

    /* =========================================================
       REWARD CARD
    ========================================================= */

    .reward-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;

      position: relative;

      display: flex;
      flex-direction: column;
      gap: 6px;

      cursor: pointer;

      transition: all 0.2s ease;
      user-select: none;
    }

    .reward-card:hover {
      border-color: #555d6d;
    }

    .reward-card.claimed {
      background-color: var(--claimed-bg);
      border-color: var(--claimed-border);
      box-shadow:
        inset 0 0 10px rgba(76, 175, 80, 0.3),
        0 0 4px rgba(76, 175, 80, 0.15);
    }

    .reward-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reward-title {
      font-weight: 600;
      font-size: 0.8rem;
      color: #fff;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      max-width: 100px;
    }

    .edit-btn {
      cursor: pointer;
      color: #ff5252;
      font-size: 0.85rem;
      transition: transform 0.1s;
    }

    .edit-btn:hover {
      transform: scale(1.2);
    }

    .reward-img-container {
      width: 100%;
      height: 70px;

      background-color: rgba(0,0,0,0.3);
      border-radius: 4px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .reward-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .reward-costs {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .cost-tag {
      font-size: 0.7rem;
      background-color: #121417;
      border: 1px solid var(--border-color);
      padding: 1px 4px;
      border-radius: 3px;

      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* =========================================================
       BOTTOM PANEL
    ========================================================= */

    .bottom-panel {
      height: 220px;

      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);

      padding: 10px 20px;

      display: flex;
      flex-direction: column;
      gap: 6px;

      flex-shrink: 0;
      min-height: 0;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .docs-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;

      flex: 1;
      min-height: 0;

      align-items: center;
    }

    .doc-item {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;

      padding: 8px;
      height: 156px;
      min-height: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .doc-item.highlight {
      border-color: var(--highlight-color);
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
      background-color: #3a3226;
    }

    .doc-icon-title {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;

      width: 100%;
      justify-content: center;
    }

    .doc-icon-title img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .doc-name {
      font-size: 0.85rem;
      color: var(--text-color);
      text-align: left;
      font-weight: 500;
      word-break: keep-all;
    }

    .doc-counters {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
      margin-top: 4px;

      background: rgba(0,0,0,0.2);

      padding: 4px;
      border-radius: 4px;
    }

    .doc-counter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .counter-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: bold;
    }

    .doc-input {
      width: 48px;
      height: 26px;

      background-color: #121417;
      border: 1px solid var(--border-color);

      color: #fff;
      text-align: center;

      border-radius: 4px;

      font-size: 0.95rem;
      font-weight: bold;
    }

    .doc-req {
      font-size: 0.8rem;
      color: #ff5252;
      font-weight: bold;

      display: flex;
      align-items: center;
    }

    @media (max-width: 1100px) {
      .docs-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .bottom-panel {
        height: 250px;
      }
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background-color: var(--panel-bg);
      border: 1px solid var(--accent-color);
      border-radius: 8px;

      padding: 20px;

      width: 420px;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }

    .modal h3 {
      color: var(--accent-color);
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background-color: var(--card-bg);

      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .modal-input-group label {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .modal-input-group input {
      width: 45px;

      background-color: #121417;
      border: 1px solid var(--border-color);

      color: #fff;
      text-align: center;

      padding: 2px;
      border-radius: 3px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;

      border: none;
      border-radius: 4px;

      cursor: pointer;

      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-save {
      background-color: #4caf50;
      color: #fff;
    }

    .btn-cancel {
      background-color: #f44336;
      color: #fff;
    }

    .btn-reset {
      background-color: #555;
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- =========================================================
       HEADER

      >
      </div>

      <div class="modal-actions">

        <button

        >
          기본값
        </button>

        <button
          class="btn btn-cancel"
          id="modalCancelBtn"
        >
          취소
        </button>

        <button
          class="btn btn-save"

        >
          저장
        </button>

      </div>

    </div>

  </div>

    function updateHighlights() {

        if (!el) return;

        el.classList.remove(
          "active",
          "highlight"

          el.classList.add("active");

          selectedDoc &&

        el.classList.remove("highlight");

          el.classList.add("highlight");

          const mapObj =
            MAPS_DATA.find(
              m => m.name === selectedMap

          if (
            mapObj &&
            mapObj.docs.includes(code)

        }

      });

    /* =========================================================
       SEASON NAME PARSER
    ========================================================== */

    function extractSeasonName(
      doc,
      htmlText
    ) {

      const candidates = [];

      if (doc.title) {
        candidates.push(doc.title);
      }

      doc
        .querySelectorAll(
          "h1, h2, h3, h4, .mw-parser-output p, .mw-parser-output div"
        )
        .forEach(el => {

          const text =
            (
              el.innerText ||
              el.textContent ||
              ""
            )
              .replace(/\s+/g, " ")
              .trim();

          if (text) {
            candidates.push(text);
          }

        });


      candidates.push(
        (
          doc.body?.innerText ||
          ""
        )
          .replace(/\s+/g, " ")
      );


      /*
       * Season 1 - "KORD BREACH"
       *
       * Season 1 - KORD BREACH
       */
      for (const candidate of candidates) {

        const seasonNumber =
          candidate.match(
            /\bSeason\s+(\d+)\b/i
          )?.[1];

        if (!seasonNumber) continue;


        let match =
          candidate.match(
            /\bSeason\s+\d+\s*[-–—:]\s*["“”']([^"“”']+)["“”']/i
          );

        if (match) {

          return `Season ${seasonNumber} - "${match[1].trim()}"`;

        }


        match =
          candidate.match(
            /\bSeason\s+\d+\s*[-–—:]\s*([^|\n\r]+)/i
          );

        if (match) {

          const name =
            match[1]
              .trim()
              .replace(/[.!,:;]+$/, "");

          if (
            name &&
            name.length < 100
          ) {

            return `Season ${seasonNumber} - "${name}"`;

          }

        }

      }

      return "";

    }


    function setSeasonName(
      seasonName
    ) {

      const seasonEl =
        document.getElementById(
          "seasonName"
        );

      if (!seasonEl) return;

      seasonEl.textContent =
        seasonName
          ? `(${seasonName})`
          : "";

    }


    /* =========================================================
       SEASON END DATE PARSER
    ========================================================== */

    /*
     * 다음과 같은 문장을 찾는다.
     *
     * The BattlePass for Season 1 started on August 3, 2026
     * and ends on December 7, 2026.
     *
     * 시즌 종료 시간이 별도로 제공되지 않기 때문에
     * 해당 날짜의 23:59:59 (UTC+3)를 종료 시각으로 사용한다.
     */

    function extractSeasonEndDate(doc) {

      const elements = [
        ...doc.querySelectorAll("p")
      ];

      /*
       * 혹시 p 구조가 바뀌더라도 전체 텍스트에서
       * 같은 문장을 찾을 수 있도록 fallback을 둔다.
       */
      const candidates = [];

      elements.forEach(el => {

        const text =
          (
            el.innerText ||
            el.textContent ||
            ""
          )
            .replace(/\s+/g, " ")
            .trim();

        if (text) {
          candidates.push(text);
        }

      });


      if (doc.body) {

        candidates.push(
          (
            doc.body.innerText ||
            doc.body.textContent ||
            ""
          )
            .replace(/\s+/g, " ")
        );

      }


      /*
       * Month names
       */
      const monthMap = {

        january: 0,
        february: 1,
        march: 2,
        april: 3,
        may: 4,
        june: 5,
        july: 6,
        august: 7,
        september: 8,
        october: 9,
        november: 10,
        december: 11

      };


      for (const text of candidates) {

        /*
         * ends on December 7, 2026
         *
         * ends on December 7 2026
         */
        const match =
          text.match(
            /\bends\s+on\s+([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})\b/i
          );

        if (!match) continue;

        const monthName =
          match[1].toLowerCase();

        const day =
          parseInt(match[2], 10);

        const year =
          parseInt(match[3], 10);

        const month =
          monthMap[monthName];

        if (
          month === undefined ||
          !day ||
          !year
        ) {
          continue;
        }


        /*
         * UTC+3
         *
         * Date.UTC()는 UTC 기준이므로
         * UTC+3의 23:59:59를 만들기 위해
         * 3시간을 빼준다.
         */
        const utcTimestamp =
          Date.UTC(
            year,
            month,
            day,
            20,
            59,
            59,
            999
          );

        return utcTimestamp;

      }

      return null;

    }


    /* =========================================================
       SET SEASON END
    ========================================================== */

    function setSeasonEndTimestamp(
      timestamp
    ) {

      if (
        !timestamp ||
        !Number.isFinite(timestamp)
      ) {

        seasonEndTimestamp = null;

        updateSeasonCountdown();

        return;

      }

      seasonEndTimestamp = timestamp;

      /*
       * 즉시 표시
       */
      updateSeasonCountdown();

    }


    /* =========================================================
       UTC+3 CURRENT TIME
    ========================================================== */

    /*
     * 현재 시간이 UTC+3인지 확인하는 것이 아니라
     * 현재 시각을 UTC timestamp로 가져온 뒤
     * 종료 timestamp와 직접 비교한다.
     *
     * 따라서 사용자의 컴퓨터가 한국 시간(UTC+9)이든
     * 다른 시간대이든 상관없이 항상 UTC+3 기준으로
     * 동일한 시즌 종료 시각을 사용한다.
     */
    function getCurrentUtc3Timestamp() {

      return Date.now();

    }


    /* =========================================================
       COUNTDOWN
    ========================================================== */

    function updateSeasonCountdown() {

      const countdownEl =
        document.getElementById(
          "seasonCountdown"
        );

      if (!countdownEl) return;


      if (!seasonEndTimestamp) {

        countdownEl.textContent =
          "00 : 00 : 00 : 00";

        return;

      }


      const now =
        getCurrentUtc3Timestamp();

      let diff =
        seasonEndTimestamp - now;


      /*
       * 시즌 종료
       */
      if (diff <= 0) {

        countdownEl.textContent =
          "00 : 00 : 00 : 00";

        return;

      }


      /*
       * milliseconds
       */
      const totalSeconds =
        Math.floor(
          diff / 1000
        );


      const days =
        Math.floor(
          totalSeconds / 86400
        );

      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      /*
       * 숫자만 표시
       *
       * 예:
       * 68 : 04 : 32 : 15
       */
      countdownEl.textContent =

        String(days).padStart(2, "0") +
        " : " +

        String(hours).padStart(2, "0") +
        " : " +

        String(minutes).padStart(2, "0") +
        " : " +

        String(seconds).padStart(2, "0");

    }


    function startSeasonCountdown() {

      if (countdownInterval) {

        clearInterval(
          countdownInterval
        );

      }

      updateSeasonCountdown();

      countdownInterval =
        setInterval(
          updateSeasonCountdown,
          1000
        );

    }


    /* =========================================================
       FANDOM DATA FETCH
    ========================================================== */

    async function fetchFandomBattlePass() {

      const targetPage =
        "BattlePass";


      const apiUrls = [

        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${encodeURIComponent(targetPage)}&prop=text&format=json&origin=*`,

        `https://escapefromtarkov.fandom.com/api.php?action=parse&page=${encodeURIComponent(targetPage)}&prop=text&format=json&origin=https://escapefromtarkov.fandom.com`

      ];


      const proxyUrls = [

        `https://api.allorigins.win/raw?url=${encodeURIComponent(
          `https://escapefromtarkov.fandom.com/wiki/${targetPage}`
        )}`,

        `https://corsproxy.io/?${encodeURIComponent(
          `https://escapefromtarkov.fandom.com/wiki/${targetPage}`
        )}`

      ];


      try {

        let htmlText = "";


        /* =====================================================
           1. FANDOM API
        ====================================================== */

        for (const url of apiUrls) {

          try {

            const res =
              await fetch(
                url,
                {
                  cache: "no-store"
                }
              );

            if (!res.ok) {
              continue;
            }


            const data =
              await res.json();

            const apiHtml =
              data?.parse?.text?.["*"];


            if (apiHtml) {

              htmlText =
                apiHtml;

              break;

            }

          } catch (e) {

            console.warn(
              "Fandom API attempt failed:",
              e
            );

          }

        }


        /* =====================================================
           2. CORS PROXY FALLBACK
        ====================================================== */

        if (!htmlText) {

          for (const url of proxyUrls) {

            try {

              const res =
                await fetch(
                  url,
                  {
                    cache: "no-store"
                  }
                );

              if (!res.ok) {
                continue;
              }


              htmlText =
                await res.text();


              if (
                htmlText &&
                htmlText.includes("<table")
              ) {

                break;

              }

            } catch (e) {

              console.warn(
                "Fandom proxy attempt failed:",
                e
              );

            }

          }

        }


        if (!htmlText) {

          console.warn(
            "Fandom BattlePass 데이터를 가져오지 못했습니다. 기본 데이터를 유지합니다."
          );

          return;

        }


        /* =====================================================
           PARSE HTML
        ====================================================== */

        const parser =
          new DOMParser();

        const doc =
          parser.parseFromString(
            htmlText,
            "text/html"
          );


        /* =====================================================
           SEASON NAME
        ====================================================== */

        const seasonName =
          extractSeasonName(
            doc,
            htmlText
          );

        if (seasonName) {

          setSeasonName(
            seasonName
          );

        }


        /* =====================================================
           SEASON END DATE
        ====================================================== */

        const seasonEnd =
          extractSeasonEndDate(
            doc
          );

        if (seasonEnd) {

          setSeasonEndTimestamp(
            seasonEnd
          );

          console.info(
            "시즌 종료 시간:",
            new Date(seasonEnd).toISOString()
          );

        } else {

          console.warn(
            "시즌 종료 날짜를 찾지 못했습니다."
          );

        }


        /* =====================================================
           FIND TABLE
        ====================================================== */

        const tables =
          [
            ...doc.querySelectorAll(
              "table.wikitable, table"
            )
          ];


        if (tables.length === 0) {

          console.warn(
            "BattlePass 테이블을 찾지 못했습니다."
          );

          return;

        }


        const targetTable =
          tables.find(table => {

            const text =
              (
                table.innerText ||
                table.textContent ||
                ""
              )
                .replace(/\s+/g, " ")
                .toLowerCase();

            return (

              text.includes("level") &&

              text.includes("price") &&

              (
                text.includes("battle points") ||
                text.includes("price (bp)")
              )

            );

          }) || tables[0];


        const rows =
          [
            ...targetTable.querySelectorAll("tr")
          ];


        const parsedPages = [];

        let currentPage = null;

        let pageCount = 0;

        let rewardIndex = 0;


        /* =====================================================
           PARSE TABLE ROWS
        ====================================================== */

        rows.forEach(tr => {

          const cells =
            [
              ...tr.querySelectorAll(
                ":scope > th, :scope > td"
              )
            ];


          if (cells.length < 3) {
            return;
          }


          const cellText =
            cells.map(c =>
              (
                c.innerText ||
                c.textContent ||
                ""
              )
                .replace(/\s+/g, " ")
                .trim()
            );


          const rowText =
            cellText.join(" ");


          /* ===================================================
             HEADER
          ================================================== */

          if (

            /^level$/i.test(
              cellText[0]
            ) ||

            cellText.some(
              v =>
                /^price(?:\s*\(bp\))?$/i.test(v)
            )

          ) {

            return;

          }


          /* ===================================================
             PAGE
          ================================================== */

          const pageMatch =
            rowText.match(
              /\bPage\s+(\d+)\b/i
            );


          if (pageMatch) {

            pageCount =
              Number(pageMatch[1]) ||
              (pageCount + 1);


            currentPage = {

              page: pageCount,

              req: "",

              rewards: []

            };


            parsedPages.push(
              currentPage
            );

          }


          /*
           * Page 표시가 첫 보상보다 먼저 나오지 않는
           * 비정상적인 구조도 처리
           */

          if (!currentPage) {

            pageCount++;

            currentPage = {

              page: pageCount,

              req: "",

              rewards: []

            };

            parsedPages.push(
              currentPage
            );

          }


          /* ===================================================
             REWARD NAME
          ================================================== */

          const nameCell =
            cells[2] ||
            cells.find(
              (c, i) =>
                i > 1 &&
                (
                  c.innerText ||
                  ""
                ).trim()
            );


          const rewardName =
            (
              nameCell?.innerText ||
              nameCell?.textContent ||
              ""
            )
              .replace(/\s+/g, " ")
              .trim();


          if (
            !rewardName ||
            /^(name|type)$/i.test(
              rewardName
            )
          ) {

            return;

          }


          /* ===================================================
             ICON
          ================================================== */

          const imgEl =

            cells[1]?.querySelector("img") ||

            cells
              .find(
                c => c.querySelector("img")
              )
              ?.querySelector("img");


          const iconSrc =
            imgEl
              ? (
                  imgEl.getAttribute("data-src") ||
                  imgEl.getAttribute("data-lazy-src") ||
                  imgEl.getAttribute("src") ||
                  ""
                )
              : "";


          /* ===================================================
             PRICE
          ================================================== */

          let priceIndex = -1;


          const headerRow =
            rows.find(r =>

              [
                ...r.querySelectorAll(
                  ":scope > th, :scope > td"
                )
              ].some(c =>

                /^price(?:\s*\(bp\))?$/i.test(
                  (
                    c.innerText ||
                    c.textContent ||
                    ""
                  ).trim()
                )

              )

            );


          if (headerRow) {

            const headers =
              [
                ...headerRow.querySelectorAll(
                  ":scope > th, :scope > td"
                )
              ]
                .map(c =>

                  (
                    c.innerText ||
                    c.textContent ||
                    ""
                  )
                    .replace(/\s+/g, " ")
                    .trim()
                    .toLowerCase()

                );


            priceIndex =
              headers.findIndex(
                v =>
                  v === "price (bp)" ||
                  v === "price"
              );

          }


          let priceText =

            priceIndex >= 0

              ? cellText[priceIndex]

              : cellText
                  .slice(3)
                  .reverse()
                  .find(
                    v =>
                      /^\d+$/.test(v)
                  ) || "1";


          const priceMatch =
            String(priceText)
              .match(/\d+/);


          const price =
            priceMatch
              ? Math.max(
                  1,
                  parseInt(
                    priceMatch[0],
                    10
                  )
                )
              : 1;


          rewardIndex++;


          currentPage.rewards.push({

            id:
              `p${currentPage.page}_${rewardIndex}`,

            name:
              rewardName,

            price,

            defaultCosts: {
              "FD": price
            },

            icon:
              iconSrc

          });

        });


        /* =====================================================
           REMOVE EMPTY PAGES
        ====================================================== */

        const validPages =
          parsedPages.filter(
            p =>
              p.rewards.length > 0
          );


        if (validPages.length > 0) {

          roadmapPages =
            validPages;


          console.info(
            `BattlePass 파싱 완료: ${validPages.length}개 페이지, ${rewardIndex}개 보상`
          );

        } else {

          console.warn(
            "BattlePass 보상 데이터를 찾지 못했습니다. 기본 데이터를 유지합니다."
          );

        }

      } catch (err) {

        console.warn(
          "Fandom Wiki fetch/parse failed, fallback to default.",
          err
        );

      }

    }


    /* =========================================================
       PAGE CLAIM STATE
    ========================================================== */

    /*
     * 해당 페이지의 모든 보상이 획득되어 있는지 확인
     */
    function isPageFullyClaimed(page) {

      if (
        !page ||
        !page.rewards ||
        page.rewards.length === 0
      ) {

        return false;

      }


      return page.rewards.every(
        reward =>
          !!claimedRewards[reward.id]
      );

    }


    /*
     * 페이지 전체 획득/미획득 토글
     *
     * 현재 미획득 보상이 하나라도 있다면
     * → 모든 보상을 획득 처리
     *
     * 모든 보상이 이미 획득 상태라면
     * → 모든 보상을 미획득 처리
     */
    function togglePageClaim(
      page
    ) {

      if (!page || !page.rewards) {
        return;
      }


      const fullyClaimed =
        isPageFullyClaimed(page);


      if (fullyClaimed) {

        /*
         * 전체 미획득
         */
        page.rewards.forEach(
          reward => {

            delete claimedRewards[
              reward.id
            ];

          }
        );

      } else {

        /*
         * 전체 획득
         */
        page.rewards.forEach(
          reward => {

            claimedRewards[
              reward.id
            ] = true;

          }
        );

      }


      localStorage.setItem(
        "eft_claimed_rewards",
        JSON.stringify(
          claimedRewards
        )
      );


      /*
       * 다시 렌더링
       */
      renderRoadmap();

      calculateRequirements();

    }


    /* =========================================================
       FIRST UNCLAIMED PAGE
    ========================================================== */

    function findFirstUnclaimedPageIndex() {

      for (
        let i = 0;
        i < roadmapPages.length;
        i++
      ) {

        const page =
          roadmapPages[i];

        const hasUnclaimed =
          page.rewards.some(
            reward =>
              !claimedRewards[
                reward.id
              ]
          );

        if (hasUnclaimed) {
          return i;
        }

      }

      /*
       * 전부 획득했다면 마지막 페이지
       */
      return Math.max(
        0,
        roadmapPages.length - 1
      );

    }


    /* =========================================================
       SCROLL TO FIRST UNCLAIMED
    ========================================================== */

    function scrollToFirstUnclaimedPage(
      behavior = "smooth"
    ) {

      const container =
        document.getElementById(
          "roadmapContainer"
        );

      if (!container) return;

      if (
        roadmapPages.length === 0
      ) {
        return;
      }


      const targetIndex =
        findFirstUnclaimedPageIndex();


      const targetColumn =
        container.children[
          targetIndex
        ];


      if (!targetColumn) return;


      /*
       * Page가 너무 화면 왼쪽에 붙지 않도록
       * 현재 padding 15px을 고려한다.
       */
      const targetLeft =
        targetColumn.offsetLeft -
        15;


      container.scrollTo({

        left:
          Math.max(
            0,
            targetLeft
          ),

        behavior

      });

    }


    /* =========================================================
       HORIZONTAL WHEEL
    ========================================================== */

    function setupHorizontalWheel() {

      const container =
        document.getElementById(
          "roadmapContainer"
        );

      if (!container) return;


      container.addEventListener(
        "wheel",
        event => {

          /*
           * Shift + Wheel은 브라우저 기본 동작을
           * 존중해서 그대로 둔다.
           */
          if (event.shiftKey) {
            return;
          }


          /*
           * 세로 휠 입력을 가로 스크롤로 변환
           */
          if (
            Math.abs(event.deltaY) >
            Math.abs(event.deltaX)
          ) {

            event.preventDefault();

            container.scrollLeft +=
              event.deltaY;

          } else if (
            Math.abs(event.deltaX) > 0
          ) {

            event.preventDefault();

            container.scrollLeft +=
              event.deltaX;

          }

        },
        {
          passive: false
        }
      );

    }


    /* =========================================================
       ROADMAP RENDER
    ========================================================== */

    function renderRoadmap() {

      const container =
        document.getElementById(
          "roadmapContainer"
        );


      /*
       * 렌더링 전에 현재 위치를 기억
       */
      const previousScrollLeft =
        container.scrollLeft;


      container.innerHTML = "";


      roadmapPages.forEach(
        (p, pageIndex) => {

          const fullyClaimed =
            isPageFullyClaimed(p);


          /* ================================================
             PAGE COLUMN
          ================================================= */

          const col =
            document.createElement(
              "div"
            );


          col.className =
            "roadmap-column page-toggleable";


          if (fullyClaimed) {

            col.classList.add(
              "page-claimed"
            );

          }


          /*
           * 페이지 전체를 클릭하면
           * 페이지 전체 보상 상태를 토글
           *
           * 단, reward-card에서 클릭한 경우는
           * reward 자체 클릭으로 처리하기 위해
           * stopPropagation을 사용한다.
           */
          col.addEventListener(
            "click",
            () => {

              togglePageClaim(p);

            }
          );


          /* ================================================
             PAGE HEADER
          ================================================= */

          const header =
            document.createElement(
              "div"
            );


          header.className =
            "column-header";


          header.innerHTML = `

            <div class="page-title-area">

              <span class="page-claim-indicator"></span>

              <span>
                Page ${p.page}
              </span>

            </div>

            <span
              style="
                font-size:0.75rem;
                color:var(--text-dim);
              "
            >
              ${p.req || ""}
            </span>

            <span
              class="page-status-text"
            >
              ${
                fullyClaimed
                  ? "CLAIMED"
                  : "UNCLAIMED"
              }
            </span>

          `;


          /*
           * header 자체에서 토글
           *
           * column에도 click이 있기 때문에
           * 여기서 stopPropagation하지 않는다.
           *
           * header 클릭 → column click → toggle
           */
          col.appendChild(
            header
          );


          /* ================================================
             COLUMN BODY
          ================================================= */

          const body =
            document.createElement(
              "div"
            );


          body.className =
            "column-body";


          /*
           * body 자체를 클릭하면 page가 토글되지 않도록
           * 막는다.
           *
           * 개별 보상 클릭은 reward-card에서 처리한다.
           */
          body.addEventListener(
            "click",
            event => {

              if (
                event.target === body
              ) {

                event.stopPropagation();

              }

            }
          );


          /* ================================================
             REWARDS
          ================================================= */

          p.rewards.forEach(
            reward => {

              const card =
                document.createElement(
                  "div"
                );


              const isClaimed =
                !!claimedRewards[
                  reward.id
                ];


              card.className =
                `reward-card ${
                  isClaimed
                    ? "claimed"
                    : ""
                }`;


              const currentCosts =
                userCosts[
                  reward.id
                ] ||
                reward.defaultCosts;


              let costTags = "";


              Object.keys(
                currentCosts
              ).forEach(
                code => {

                  const amt =
                    currentCosts[code];


                  if (amt > 0) {

                    costTags += `

                      <span class="cost-tag">

                        <img
                          src="${DOCS_DATA[code].file}"
                          style="
                            width:12px;
                            height:12px
                          "
                          onerror="
                            this.style.display='none'
                          "
                        >

                        ${amt} ${code}

                      </span>

                    `;

                  }

                }
              );


              card.innerHTML = `

                <div class="reward-title-row">

                  <div
                    class="reward-title"
                    title="${reward.name}"
                  >
                    ${reward.name}
                  </div>

                  <span
                    class="edit-btn"
                    title="재화 수정"
                  >
                    ✏️
                  </span>

                </div>

                <div class="reward-img-container">

                  <img
                    src="${reward.icon}"
                    alt="${reward.name}"
                    onerror="
                      this.src='https://via.placeholder.com/80?text=Reward'
                    "
                  >

                </div>

                <div class="reward-costs">
                  ${costTags}
                </div>

              `;


              /* ==============================================
                 EDIT BUTTON
              ============================================== */

              const editBtn =
                card.querySelector(
                  ".edit-btn"
                );


              editBtn.addEventListener(
                "click",
                event => {

                  event.stopPropagation();

                  openEditModal(
                    reward.id
                  );

                }
              );


              /* ==============================================
                 REWARD CLICK
              ============================================== */

              card.addEventListener(
                "click",
                event => {

                  /*
                   * 부모 Page 클릭 방지
                   */
                  event.stopPropagation();


                  if (
                    claimedRewards[
                      reward.id
                    ]
                  ) {

                    delete claimedRewards[
                      reward.id
                    ];

                  } else {

                    claimedRewards[
                      reward.id
                    ] = true;

                  }


                  localStorage.setItem(
                    "eft_claimed_rewards",
                    JSON.stringify(
                      claimedRewards
                    )
                  );


                  renderRoadmap();

                  calculateRequirements();

                }
              );


              body.appendChild(card);

            }
          );


          col.appendChild(body);

          container.appendChild(col);

        }
      );


      /*
       * 최초 렌더링은 미획득 보상 위치로 이동.
       *
       * 이미 화면 위치를 사용자가 보고 있던 상태에서는
       * 불필요하게 화면을 움직이지 않는다.
       *
       * 처음 렌더링이거나 페이지 상태를 변경한 경우에는
       * 미획득 위치로 이동한다.
       */
      requestAnimationFrame(
        () => {

          if (
            previousScrollLeft === 0
          ) {

            scrollToFirstUnclaimedPage(
              "auto"
            );

          }

        }
      );

    }


    /* =========================================================
       EDIT MODAL
    ========================================================== */

    function openEditModal(
      rewardId
    ) {

      let reward = null;


      for (
        const p of roadmapPages
      ) {

        const found =
          p.rewards.find(
            r =>
              r.id === rewardId
          );


        if (found) {

          reward = found;

          break;

        }

      }


      if (!reward) return;


      currentEditReward =
        reward;


      document.getElementById(
        "modalTitle"
      ).innerText =
        `Edit Costs: ${reward.name}`;


      document.getElementById(
        "maxPriceVal"
      ).innerText =
        reward.price;


      const grid =
        document.getElementById(
          "modalGrid"
        );


      grid.innerHTML = "";


      const activeCosts =
        userCosts[
          reward.id
        ] ||
        reward.defaultCosts;


      Object.keys(
        DOCS_DATA
      ).forEach(
        code => {

          const val =
            activeCosts[code] ||
            0;


          const group =
            document.createElement(
              "div"
            );


          group.className =
            "modal-input-group";


          group.innerHTML = `

            <label>

              <img
                src="${DOCS_DATA[code].file}"
                style="
                  width:14px;
                  height:14px;
                "
                onerror="
                  this.style.display='none'
                "
              >

              ${DOCS_DATA[code].name}

            </label>

            <input
              type="number"
              min="0"
              value="${val}"
              data-modal-code="${code}"
            >

          `;


          grid.appendChild(
            group
          );

        }
      );


      document.getElementById(
        "editModal"
      ).style.display =
        "flex";

    }


    function closeModal() {

      document.getElementById(
        "editModal"
      ).style.display =
        "none";


      currentEditReward =
        null;

    }


    /* =========================================================
       MODAL SAVE
    ========================================================== */

    document.getElementById(
      "modalSaveBtn"
    ).addEventListener(
      "click",
      () => {

        if (!currentEditReward) {
          return;
        }


        const inputs =
          document.querySelectorAll(
            "[data-modal-code]"
          );


        let sum = 0;

        const newCosts = {};


        inputs.forEach(
          input => {

            const code =
              input.getAttribute(
                "data-modal-code"
              );


            const val =
              parseInt(
                input.value
              ) || 0;


            if (val > 0) {

              newCosts[code] =
                val;

            }


            sum += val;

          }
        );


        if (
          sum >
          currentEditReward.price
        ) {

          alert(
            `입력하신 재화의 총합(${sum})이 해당 보상의 필요 총량(${currentEditReward.price})을 초과할 수 없습니다.`
          );

          return;

        }


        userCosts[
          currentEditReward.id
        ] =
          newCosts;


        localStorage.setItem(
          "eft_user_costs",
          JSON.stringify(
            userCosts
          )
        );


        closeModal();

        renderRoadmap();

        calculateRequirements();

      }
    );


    /* =========================================================
       MODAL RESET
    ========================================================== */

    document.getElementById(
      "modalResetBtn"
    ).addEventListener(
      "click",
      () => {

        if (!currentEditReward) {
          return;
        }


        delete userCosts[
          currentEditReward.id
        ];


        localStorage.setItem(
          "eft_user_costs",
          JSON.stringify(
            userCosts
          )
        );


        closeModal();

        renderRoadmap();

        calculateRequirements();

      }
    );


    /* =========================================================
       MODAL CANCEL
    ========================================================== */

    document.getElementById(
      "modalCancelBtn"
    ).addEventListener(
      "click",
      closeModal
    );


    /* =========================================================
       CLICK OUTSIDE MODAL
    ========================================================== */

    document.getElementById(
      "editModal"
    ).addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "editModal"
        ) {

          closeModal();

        }

      }
    );


    /* =========================================================
       REQUIREMENT CALCULATION
    ========================================================== */

    function calculateRequirements() {

      const totals = {

        "FD": 0,
        "PD": 0,
        "TD": 0,
        "MD": 0,
        "PMC": 0,
        "BP": 0,
        "UD": 0,
        "Tech": 0

      };


      /*
       * 미수령 보상만 계산
       */
      roadmapPages.forEach(
        p => {

          p.rewards.forEach(
            r => {

              if (
                !claimedRewards[
                  r.id
                ]
              ) {

                const costs =
                  userCosts[
                    r.id
                  ] ||
                  r.defaultCosts;


                Object.keys(
                  costs
                ).forEach(
                  code => {

                    if (
                      totals[code] !==
                      undefined
                    ) {

                      totals[code] +=
                        costs[code];

                    }

                  }
                );

              }

            }
          );

        }
      );


      /*
       * 보유량 차감
       */
      Object.keys(
        totals
      ).forEach(
        code => {

          const currentInv =
            userInventory[
              code
            ] || 0;


          const remainReq =
            Math.max(
              0,
              totals[code] -
              currentInv
            );


          const reqEl =
            document.getElementById(
              `req-${code}`
            );


          if (reqEl) {

            reqEl.innerText =
              `필요: ${remainReq}`;


            reqEl.style.color =
              remainReq === 0
                ? "#4caf50"
                : "#ff5252";

          }

        }
      );

    }


    /* =========================================================
       START
    ========================================================== */

    init();

  </script>

</body>
</html>
